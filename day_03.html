<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day XX · Ruth's 21st</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Patrick+Hand&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ─── RESET ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --pink: #f5a0b8;
            --purple: #c78bdb;
            --peach: #f5c6a0;
            --cream: #fcf6f0;
            --text: #2d2a3a;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.07);
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(248, 164, 184, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(199, 139, 219, 0.20) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(245, 198, 160, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .placeholder {
            position: relative;
            z-index: 1;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px 40px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .header .name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 8vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb, #f5c6a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .header .sub {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            color: #b8a6c9;
            margin-top: -2px;
            letter-spacing: 0.08em;
        }

        .header .day-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 24px;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #c27b9e;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px rgba(194, 123, 158, 0.08);
            margin-top: 12px;
            transition: 0.3s ease;
        }

        .header .day-badge strong {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f5b8b8, #c78bdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .day-display {
            margin: 24px 0 12px;
        }

        .day-display .big-day {
            font-family: 'Playfair Display', serif;
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 700;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb, #f5c6a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 0 4px 40px rgba(199, 139, 219, 0.15);
        }

        .day-display .day-label {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.2rem;
            color: #b8a6c9;
            letter-spacing: 0.12em;
            margin-top: -4px;
        }

        .coming-soon {
            margin: 18px 0 24px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 60px;
            display: inline-block;
            border: 1px solid rgba(199, 139, 219, 0.15);
            backdrop-filter: blur(4px);
        }

        .coming-soon .badge {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.4rem;
            color: #c27b9e;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .coming-soon .badge .day-emoji {
            font-size: 1.8rem;
            line-height: 1;
        }

        .day-countdown {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 18px 0 28px;
        }

        .day-countdown .item {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 14px 6px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
            min-width: 56px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .day-countdown .item .num {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            display: block;
        }

        .day-countdown .item .label {
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #a392b0;
            font-weight: 600;
            margin-top: 2px;
        }

        .message-box {
            margin: 12px 0 28px;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 16px rgba(199, 139, 219, 0.04);
            transition: 0.3s ease;
        }

        .message-box .message-content {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            color: #3d344a;
            line-height: 1.7;
        }

        .message-box .message-content .highlight-emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
        }

        .message-box .message-content .day-date {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: #b8a6c9;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-top: 10px;
            display: block;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 36px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(199, 139, 219, 0.18);
            transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            letter-spacing: 0.02em;
        }

        .back-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 44px rgba(199, 139, 219, 0.28);
        }

        .back-btn:active {
            transform: scale(0.95);
        }

        .back-btn span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .wish-mini {
            margin-top: 16px;
        }

        .wish-mini button {
            background: none;
            border: none;
            font-family: 'Patrick Hand', cursive;
            font-size: 0.95rem;
            color: #b8a6c9;
            cursor: pointer;
            transition: 0.3s ease;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .wish-mini button:hover {
            color: #c27b9e;
            background: rgba(199, 139, 219, 0.06);
        }

        .wish-mini .wish-response {
            font-family: 'Patrick Hand', cursive;
            font-size: 1rem;
            color: #c27b9e;
            min-height: 1.8rem;
            opacity: 0;
            transition: 0.5s ease;
            transform: translateY(6px);
            margin-top: 4px;
        }

        .wish-mini .wish-response.show {
            opacity: 1;
            transform: translateY(0);
        }

        .sparkle-burst {
            position: fixed;
            pointer-events: none;
            font-size: 1.4rem;
            animation: burst 0.8s ease-out forwards;
            z-index: 999;
        }

        @keyframes burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.2) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.6) rotate(400deg);
            }
        }

        .confetti-piece {
            position: fixed;
            pointer-events: none;
            z-index: 998;
            width: 7px;
            height: 7px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg) scale(0.2);
            }
        }

        @media (max-width: 600px) {
            .placeholder {
                padding: 20px 16px 30px;
                border-radius: 24px;
            }
            .header .name {
                font-size: 2.8rem;
            }
            .header .sub {
                font-size: 0.9rem;
            }
            .day-display .big-day {
                font-size: 5rem;
            }
            .day-countdown .item {
                min-width: 44px;
                padding: 6px 10px 4px;
            }
            .day-countdown .item .num {
                font-size: 1.4rem;
            }
            .coming-soon .badge {
                font-size: 1.1rem;
            }
            .back-btn {
                padding: 10px 28px;
                font-size: 0.85rem;
            }
            .message-box .message-content {
                font-size: 0.95rem;
            }
            .message-box {
                padding: 16px 16px;
            }
        }

        @media (max-width: 400px) {
            .header .name {
                font-size: 2.2rem;
            }
            .day-display .big-day {
                font-size: 3.8rem;
            }
            .day-countdown {
                gap: 6px;
            }
            .day-countdown .item {
                min-width: 36px;
                padding: 4px 6px 3px;
            }
            .day-countdown .item .num {
                font-size: 1.1rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--cream);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="bg" aria-hidden="true"></div>

    <div class="placeholder" id="app">

        <header class="header">
            <div class="name">Ruth</div>
            <div class="sub">twenty‑one · a celebration</div>
            <div class="day-badge" id="dayBadge">
                day <strong id="dayNumber">—</strong> · countdown
            </div>
        </header>

        <div class="day-display">
            <div class="big-day" id="bigDay">—</div>
            <div class="day-label" id="dayLabel">days to go ✦</div>
        </div>

        <div class="coming-soon">
            <div class="badge">
                <span class="day-emoji" id="dayEmoji">🌸</span>
                coming soon · check back
                <span class="day-emoji" id="dayEmoji2">🌸</span>
            </div>
        </div>

        <div class="day-countdown" id="dayCountdown" role="timer" aria-label="Countdown to this day">
            <div class="item">
                <span class="num" id="cdDays">00</span>
                <span class="label">days</span>
            </div>
            <div class="item">
                <span class="num" id="cdHours">00</span>
                <span class="label">hours</span>
            </div>
            <div class="item">
                <span class="num" id="cdMinutes">00</span>
                <span class="label">mins</span>
            </div>
            <div class="item">
                <span class="num" id="cdSeconds">00</span>
                <span class="label">secs</span>
            </div>
        </div>

        <div class="message-box" id="messageBox">
            <div class="message-content" id="messageContent">
                <span class="highlight-emoji" id="msgEmoji">✨</span>
                <span id="msgText">This day of the countdown hasn't arrived yet.</span>
                <span class="day-date" id="msgDate"></span>
            </div>
        </div>

        <a href="index.html" class="back-btn" id="backBtn">
            <span>← back to celebration</span>
        </a>

        <div class="wish-mini">
            <button id="wishMiniBtn">💫 send a little love</button>
            <div class="wish-response" id="wishResponse"></div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            const BIRTHDAY = new Date(2026, 8, 18, 0, 0, 0).getTime();

            // ─── ROMANTIC MESSAGES WITH SIMPLE, PUNCHY LABELS ───
            const DAY_DETAILS = {
                1: {
                    emoji: '🌅',
                    label: 'Tomorrow is the day!',
                    message: 'My heart is already bursting with love for you. Tomorrow, the world gets to celebrate the most beautiful soul I know. You are my dawn, my light, my everything. See you at 21, my love.'
                },
                2: {
                    emoji: '💫',
                    label: 'Two days left!',
                    message: 'Every moment without you feels like a lifetime, but knowing you\'re about to step into the most magnificent year yet fills me with such joy. You are the star that guides me home, Ruth.'
                },
                3: {
                    emoji: '🌙',
                    label: 'Three days to go!',
                    message: 'I close my eyes and I see your smile—it\'s the only thing I need. These last few days are a gentle reminder of how deeply I cherish you. You are my moon, my tide, my constant.'
                },
                4: {
                    emoji: '🕊️',
                    label: 'Four days!',
                    message: 'My soul is already dancing at the thought of celebrating you. You\'ve filled my life with so much tenderness and grace. I can\'t wait to hold you and whisper how much you mean to me.'
                },
                5: {
                    emoji: '🌺',
                    label: 'Five days!',
                    message: 'You are the most exquisite flower in my garden. With every passing day, I fall more in love with the person you are. Your 21st will be as radiant as your heart.'
                },
                6: {
                    emoji: '✨',
                    label: 'Six days!',
                    message: 'My greatest blessing is you, Ruth. Every heartbeat brings me closer to the day I get to see you shine even brighter. You are my miracle, my forever, my home.'
                },
                7: {
                    emoji: '🌈',
                    label: 'One week to go!',
                    message: 'A week from today, I\'ll be looking into your eyes, celebrating the most incredible person I\'ve ever known. You are my rainbow after every storm, my hope, my love.'
                },
                8: {
                    emoji: '🌅',
                    label: 'Eight days!',
                    message: 'The anticipation is like golden honey, sweet and slow. You are the warmth I wake up for, the tenderness I hold onto. I\'m counting every second until I can hold you close.'
                },
                9: {
                    emoji: '🎈',
                    label: 'Nine days!',
                    message: 'If I could write you a thousand love letters, they still wouldn\'t capture how much you mean to me. You are poetry in motion, and I\'m so ready to celebrate every beautiful part of you.'
                },
                10: {
                    emoji: '🥂',
                    label: 'Ten days!',
                    message: 'Here we are, my love—the final stretch. Ten days until I get to toast to you, to us, to everything you are and everything you\'ll become. You are my greatest adventure, and I\'m so grateful to walk this path with you.'
                }
            };

            function getDayFromURL() {
                const path = window.location.pathname;
                const match = path.match(/day_(\d{2})\.html/i);
                if (match) return parseInt(match[1], 10);
                const params = new URLSearchParams(window.location.search);
                const q = params.get('day');
                if (q) return parseInt(q, 10);
                return null;
            }

            const day = getDayFromURL();

            const dayNumberEl = document.getElementById('dayNumber');
            const bigDayEl = document.getElementById('bigDay');
            const dayLabelEl = document.getElementById('dayLabel');
            const dayEmoji = document.getElementById('dayEmoji');
            const dayEmoji2 = document.getElementById('dayEmoji2');
            const cdDays = document.getElementById('cdDays');
            const cdHours = document.getElementById('cdHours');
            const cdMinutes = document.getElementById('cdMinutes');
            const cdSeconds = document.getElementById('cdSeconds');
            const msgEmoji = document.getElementById('msgEmoji');
            const msgText = document.getElementById('msgText');
            const msgDate = document.getElementById('msgDate');
            const wishMiniBtn = document.getElementById('wishMiniBtn');
            const wishResponse = document.getElementById('wishResponse');
            const backBtn = document.getElementById('backBtn');
            const dayBadge = document.getElementById('dayBadge');

            const WISHES = [
                'Ruth, you are pure magic ✨', '21 looks stunning on you 💖',
                'Every moment with you is a gift 🌟', 'Can’t wait to celebrate you! 🥳',
                'You make the world brighter ❤️', 'Forever and always, Ruth 💫',
                'So grateful for you 🌸', 'You deserve all the joy in the world 🦋',
                'Happy 21st, beautiful soul 💗', 'Here’s to you and all your dreams 🌙',
                'Sending you the biggest hug 🤗', 'You are so loved 💕',
                'Your light shines so bright ⭐', 'Cheers to 21 years of you 🥂',
                'Ruth, you are one of a kind 🌺', 'My heart beats for you ❤️‍🔥',
                'You are my everything 💖', 'Forever yours, always and truly 💞'
            ];

            if (day !== null && day >= 1 && day <= 10) {
                const details = DAY_DETAILS[day] || DAY_DETAILS[10];

                dayNumberEl.textContent = String(day).padStart(2, '0');
                bigDayEl.textContent = String(day).padStart(2, '0');
                dayEmoji.textContent = details.emoji;
                dayEmoji2.textContent = details.emoji;

                const dayDate = new Date(BIRTHDAY);
                dayDate.setDate(dayDate.getDate() - day);
                const dateStr = dayDate.toLocaleDateString('en-US', {
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });

                // Keep the romantic full message, but use the simple label in the badge
                msgEmoji.textContent = details.emoji;
                msgText.innerHTML = `<strong>${details.label}</strong><br />${details.message}`;
                msgDate.textContent = `📅 ${dateStr} · ${day} days to go`;

                // Simple badge
                dayBadge.innerHTML =
                    `💕 day <strong>${String(day).padStart(2, '0')}</strong> · ${details.label}`;

                window._targetTime = dayDate.getTime();
                backBtn.href = 'index.html';
                document.title = `Day ${String(day).padStart(2, '0')} · ${details.label}`;

            } else {
                dayNumberEl.textContent = '—';
                bigDayEl.textContent = '?';
                dayEmoji.textContent = '💕';
                dayEmoji2.textContent = '💕';
                msgEmoji.textContent = '✨';
                msgText.innerHTML =
                    'This page is part of Ruth\'s 21st countdown. Please visit the <a href="index.html" style="color:#c78bdb;text-decoration:none;font-weight:600;">main celebration</a> to follow along.';
                msgDate.textContent = '';
                window._targetTime = BIRTHDAY;
                document.title = 'Countdown · Ruth\'s 21st';
            }

            function updateCountdown() {
                const now = Date.now();
                const target = window._targetTime || BIRTHDAY;
                let diff = Math.max(0, target - now);

                if (diff === 0) {
                    cdDays.textContent = '00';
                    cdHours.textContent = '00';
                    cdMinutes.textContent = '00';
                    cdSeconds.textContent = '00';
                    return;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);

                cdDays.textContent = String(d).padStart(2, '0');
                cdHours.textContent = String(h).padStart(2, '0');
                cdMinutes.textContent = String(m).padStart(2, '0');
                cdSeconds.textContent = String(s).padStart(2, '0');
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);

            function sparkleBurst(cx, cy, count) {
                const emojis = ['❤️', '💖', '✨', '🌟', '🎉', '💗', '🌸', '🌺', '🥳', '🎂', '💕', '🦋', '⭐', '💫', '🎊', '🌈'];
                const total = count || 24 + Math.floor(Math.random() * 16);
                for (let i = 0; i < total; i++) {
                    const spark = document.createElement('div');
                    spark.className = 'sparkle-burst';
                    spark.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 60 + Math.random() * 180;
                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist - 50;
                    spark.style.setProperty('--tx', tx + 'px');
                    spark.style.setProperty('--ty', ty + 'px');
                    spark.style.left = (cx || window.innerWidth / 2) + 'px';
                    spark.style.top = (cy || window.innerHeight / 2) + 'px';
                    spark.style.fontSize = 1 + Math.random() * 1.8 + 'rem';
                    spark.style.animationDuration = 0.4 + Math.random() * 0.6 + 's';
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 1200);
                }
            }

            function confettiBurst(cx, cy) {
                const colors = ['#f8a4b8', '#c78bdb', '#f5c6a0', '#ffd6d6', '#d4b8e0', '#fce7f3', '#ffb3c6', '#b8d4e3'];
                const count = 40 + Math.floor(Math.random() * 30);
                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = (cx || window.innerWidth / 2) + 'px';
                    piece.style.top = (cy || window.innerHeight / 2) + 'px';
                    piece.style.width = (4 + Math.random() * 7) + 'px';
                    piece.style.height = (4 + Math.random() * 7) + 'px';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 60 + Math.random() * 300;
                    piece.style.animationDuration = (1.0 + Math.random() * 1.6) + 's';
                    piece.style.animationDelay = (Math.random() * 0.5) + 's';
                    piece.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                    piece.style.setProperty('--ty', Math.sin(angle) * dist - 140 + 'px');
                    document.body.appendChild(piece);
                    setTimeout(() => piece.remove(), 2800);
                }
            }

            wishMiniBtn.addEventListener('click', function(e) {
                const cx = e.clientX || window.innerWidth / 2;
                const cy = e.clientY || window.innerHeight / 2;
                sparkleBurst(cx, cy, 30);
                confettiBurst(cx, cy);

                const msg = WISHES[Math.floor(Math.random() * WISHES.length)];
                wishResponse.textContent = msg;
                wishResponse.className = 'wish-response show';

                const badge = document.querySelector('.day-badge');
                if (badge) {
                    const orig = badge.innerHTML;
                    badge.innerHTML = '💫 ' + msg;
                    badge.style.background = 'rgba(252, 231, 243, 0.8)';
                    setTimeout(() => {
                        badge.innerHTML = orig;
                        badge.style.background = '';
                    }, 3000);
                }

                setTimeout(() => {
                    wishResponse.className = 'wish-response';
                }, 4200);
            });

            document.addEventListener('click', function(e) {
                const tag = e.target.tagName.toLowerCase();
                if (tag === 'a' || tag === 'button' || e.target.closest('.sparkle-burst')) return;
                if (Math.random() > 0.25) return;
                sparkleBurst(e.clientX, e.clientY, 6);
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    const el = document.activeElement;
                    if (el) el.blur();
                }
                if (e.key === 'h' || e.key === 'H') {
                    window.location.href = 'index.html';
                }
            });

            console.log(`🌸 Day ${day || '?'} · Romantic message with simple label 💖`);
        })();
    </script>

</body>
</html>
