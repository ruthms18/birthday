<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ruth's 21st · Sliding Puzzle</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Patrick+Hand&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --pink: #f5a0b8;
            --purple: #c78bdb;
            --peach: #f5c6a0;
            --cream: #fcf6f0;
            --text: #2d2a3a;
            --radius: 16px;
            --board-size: min(80vw, 80vh, 420px);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a1625;
            color: #fff;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(248, 164, 184, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(199, 139, 219, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(245, 198, 160, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 16px 16px 20px;
            background: rgba(26, 22, 37, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 4px 12px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .brand .name {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb, #f5c6a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .brand .day {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(199, 139, 219, 0.5);
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(199, 139, 219, 0.08);
        }

        .header .back-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: 600;
            letter-spacing: 0.03em;
        }
        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .controls .info {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .controls .info .moves {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: #fff;
            font-weight: 700;
        }
        .controls .info .moves.pink {
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .controls .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 6px 18px;
            border-radius: 30px;
            border: none;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            touch-action: manipulation;
            letter-spacing: 0.02em;
        }

        .btn-sm.primary {
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            color: #fff;
            box-shadow: 0 4px 20px rgba(199, 139, 219, 0.2);
        }
        .btn-sm.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(199, 139, 219, 0.3);
        }

        .btn-sm.secondary {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
        }
        .btn-sm.secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-sm:active {
            transform: scale(0.92);
        }

        /* ─── PUZZLE BOARD ─── */
        .puzzle-board {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            touch-action: none;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.2);
        }

        .puzzle-board .tile {
            position: absolute;
            border-radius: 8px;
            background-size: 300% 300%;
            background-repeat: no-repeat;
            cursor: pointer;
            transition: top 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                left 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.15s ease,
                box-shadow 0.15s ease;
            will-change: top, left, transform;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            z-index: 1;
            touch-action: none;
        }

        .puzzle-board .tile:not(.empty):hover {
            transform: scale(1.02);
            z-index: 2;
            border-color: rgba(248, 164, 184, 0.2);
        }

        .puzzle-board .tile:not(.empty):active {
            transform: scale(0.92);
        }

        .puzzle-board .tile.empty {
            background: rgba(255, 255, 255, 0.02) !important;
            border: 1px dashed rgba(255, 255, 255, 0.04);
            cursor: default;
            box-shadow: none;
        }

        .puzzle-board .tile.correct {
            border-color: rgba(199, 139, 219, 0.1);
        }

        .puzzle-board .tile .tile-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.1);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 8px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }

        /* ─── OVERLAY: COMPLETE ─── */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(26, 22, 37, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.92);
        }

        .overlay.open {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        .overlay .big-emoji {
            font-size: 4rem;
            margin-bottom: 6px;
            animation: float 2.5s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .overlay h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }

        .overlay p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            max-width: 280px;
            line-height: 1.6;
            margin-bottom: 4px;
            font-weight: 300;
        }

        .overlay .sub-message {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 16px;
        }

        .overlay .final-moves {
            font-family: 'Playfair Display', serif;
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 2px;
        }
        .overlay .final-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        .btn-primary {
            padding: 12px 44px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(199, 139, 219, 0.2);
            transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.02em;
            touch-action: manipulation;
            margin-top: 4px;
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 44px rgba(199, 139, 219, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.95);
        }

        /* ─── KEYBOARD HELP ─── */
        .kb-help {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            opacity: 0.2;
            transition: opacity 0.3s;
            font-size: 0.55rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.05em;
            font-family: 'Inter', sans-serif;
        }
        .kb-help:hover {
            opacity: 0.5;
        }
        .kb-help kbd {
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-family: inherit;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
        }

        /* ─── SPARKLES ─── */
        .sparkle-burst {
            position: fixed;
            pointer-events: none;
            font-size: 1.2rem;
            animation: burst 0.8s ease-out forwards;
            z-index: 999;
        }
        @keyframes burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.2) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(1.6) rotate(400deg);
            }
        }

        .confetti-piece {
            position: fixed;
            pointer-events: none;
            z-index: 998;
            width: 6px;
            height: 6px;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg) scale(0.2);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(26, 22, 37, 0.9);
            backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            font-weight: 400;
            font-family: 'Inter', sans-serif;
            transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            pointer-events: none;
            z-index: 200;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            .wrapper {
                padding: 10px 10px 14px;
                border-radius: 24px;
            }
            :root {
                --board-size: min(82vw, 400px);
            }
            .puzzle-board {
                border-radius: 12px;
            }
            .puzzle-board .tile {
                border-radius: 6px;
            }
            .header .brand .name {
                font-size: 0.95rem;
            }
            .overlay h2 {
                font-size: 1.5rem;
            }
            .overlay .big-emoji {
                font-size: 3rem;
            }
            .btn-primary {
                padding: 10px 32px;
                font-size: 0.85rem;
            }
            .controls .info {
                font-size: 0.65rem;
            }
            .btn-sm {
                padding: 5px 14px;
                font-size: 0.6rem;
            }
            .puzzle-board .tile .tile-label {
                font-size: 0.5rem;
            }
        }

        @media (max-width: 380px) {
            .header .brand .name {
                font-size: 0.8rem;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .controls .btn-group {
                justify-content: center;
            }
            .overlay h2 {
                font-size: 1.2rem;
            }
            .overlay p {
                font-size: 0.75rem;
            }
            .btn-primary {
                padding: 8px 24px;
                font-size: 0.75rem;
            }
            :root {
                --board-size: min(78vw, 320px);
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            :root {
                --board-size: min(60vh, 380px);
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div class="bg" aria-hidden="true"></div>

    <div class="wrapper">
        <!-- HEADER -->
        <div class="header">
            <div class="brand">
                <span class="name">Ruth</span>
                <span class="day">slide</span>
            </div>
            <button class="back-btn" id="backBtn">← back</button>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <div class="info">
                <span>moves</span>
                <span class="moves pink" id="movesDisplay">0</span>
            </div>
            <div class="btn-group">
                <button class="btn-sm secondary" id="shuffleBtn">🔀 shuffle</button>
                <button class="btn-sm secondary" id="resetBtn">↺ reset</button>
            </div>
        </div>

        <!-- PUZZLE BOARD -->
        <div class="puzzle-board" id="puzzleBoard">
            <!-- tiles will be rendered here -->
            <!-- OVERLAY: COMPLETE -->
            <div class="overlay" id="completeOverlay">
                <div class="big-emoji">🧩</div>
                <h2>you solved it!</h2>
                <div class="final-moves" id="finalMoves">0</div>
                <div class="final-label">moves</div>
                <p style="margin-top:6px;font-size:0.9rem;color:rgba(255,255,255,0.4);">
                    "you complete me" 💕
                </p>
                <div class="sub-message">Ruth · 21st celebration</div>
                <button class="btn-primary" id="playAgainBtn">🎮 play again</button>
            </div>
        </div>

        <!-- KEYBOARD HELP -->
        <div class="kb-help">
            <span>use</span>
            <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd>
            <span style="margin-left:4px;">or click tiles</span>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            // ─── CONFIG ───
            const GRID_SIZE = 3;
            const TOTAL_TILES = GRID_SIZE * GRID_SIZE;
            const IMAGE_SRC = 'ruth1.jpg';

            // ─── STATE ───
            let boardEl = document.getElementById('puzzleBoard');
            let movesDisplay = document.getElementById('movesDisplay');
            let completeOverlay = document.getElementById('completeOverlay');
            let finalMoves = document.getElementById('finalMoves');
            let toast = document.getElementById('toast');

            let state = [];
            let emptyIndex = TOTAL_TILES - 1;
            let moves = 0;
            let isComplete = false;
            let imageLoaded = false;
            let tileSize = 0;
            let gap = 4;

            // ─── HELPERS ───
            function getTileSize() {
                const rect = boardEl.getBoundingClientRect();
                return rect.width / GRID_SIZE;
            }

            function getPosition(index) {
                const size = getTileSize();
                const row = Math.floor(index / GRID_SIZE);
                const col = index % GRID_SIZE;
                return {
                    top: row * size + gap / 2,
                    left: col * size + gap / 2,
                    size: size - gap
                };
            }

            // ─── TOAST ───
            let toastTimeout = null;

            function showToast(message, duration = 1800) {
                toast.textContent = message;
                toast.className = 'toast show';
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.className = 'toast';
                }, duration);
            }

            // ─── SPARKLES ───
            function sparkleBurst(cx, cy, count = 20) {
                const emojis = ['❤️', '💖', '✨', '🌟', '🎉', '💗', '🌸', '🌺', '🥳', '💕', '🦋', '⭐', '💫', '🎊', '🌈'];
                const total = count || 20 + Math.floor(Math.random() * 16);
                for (let i = 0; i < total; i++) {
                    const spark = document.createElement('div');
                    spark.className = 'sparkle-burst';
                    spark.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 50 + Math.random() * 160;
                    const tx = Math.cos(angle) * dist;
                    const ty = Math.sin(angle) * dist - 40;
                    spark.style.setProperty('--tx', tx + 'px');
                    spark.style.setProperty('--ty', ty + 'px');
                    spark.style.left = (cx || window.innerWidth / 2) + 'px';
                    spark.style.top = (cy || window.innerHeight / 2) + 'px';
                    spark.style.fontSize = 0.8 + Math.random() * 1.6 + 'rem';
                    spark.style.animationDuration = 0.4 + Math.random() * 0.6 + 's';
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 1200);
                }
            }

            function confettiBurst(cx, cy) {
                const colors = ['#f8a4b8', '#c78bdb', '#f5c6a0', '#ffd6d6', '#d4b8e0', '#fce7f3', '#ffb3c6', '#b8d4e3', '#ffd700',
                    '#ff6b9d'
                ];
                const count = 50 + Math.floor(Math.random() * 40);
                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = (cx || window.innerWidth / 2) + 'px';
                    piece.style.top = (cy || window.innerHeight / 2) + 'px';
                    piece.style.width = (4 + Math.random() * 7) + 'px';
                    piece.style.height = (4 + Math.random() * 7) + 'px';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    const angle = Math.random() * 2 * Math.PI;
                    const dist = 60 + Math.random() * 300;
                    piece.style.animationDuration = (1.0 + Math.random() * 1.6) + 's';
                    piece.style.animationDelay = (Math.random() * 0.5) + 's';
                    piece.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                    piece.style.setProperty('--ty', Math.sin(angle) * dist - 140 + 'px');
                    document.body.appendChild(piece);
                    setTimeout(() => piece.remove(), 2800);
                }
            }

            // ─── PUZZLE LOGIC ───
            function isAdjacent(indexA, indexB) {
                const rowA = Math.floor(indexA / GRID_SIZE);
                const colA = indexA % GRID_SIZE;
                const rowB = Math.floor(indexB / GRID_SIZE);
                const colB = indexB % GRID_SIZE;
                return (Math.abs(rowA - rowB) + Math.abs(colA - colB)) === 1;
            }

            function getNeighbors(index) {
                const row = Math.floor(index / GRID_SIZE);
                const col = index % GRID_SIZE;
                const neighbors = [];
                if (row > 0) neighbors.push(index - GRID_SIZE);
                if (row < GRID_SIZE - 1) neighbors.push(index + GRID_SIZE);
                if (col > 0) neighbors.push(index - 1);
                if (col < GRID_SIZE - 1) neighbors.push(index + 1);
                return neighbors;
            }

            function getSolvedState() {
                return Array.from({ length: TOTAL_TILES }, (_, i) => (i + 1) % TOTAL_TILES);
            }

            function isSolved() {
                return state.every((val, idx) => val === (idx + 1) % TOTAL_TILES);
            }

            function checkWin() {
                if (isSolved() && !isComplete) {
                    isComplete = true;
                    completeOverlay.classList.add('open');
                    finalMoves.textContent = moves;
                    const rect = boardEl.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    for (let i = 0; i < 6; i++) {
                        setTimeout(() => {
                            sparkleBurst(
                                cx + (Math.random() - 0.5) * 200,
                                cy + (Math.random() - 0.5) * 200,
                                30 + Math.random() * 20
                            );
                        }, i * 200);
                    }
                    confettiBurst(cx, cy);
                    setTimeout(() => {
                        sparkleBurst(cx, cy, 50);
                    }, 300);
                    showToast('🧩 puzzle complete!', 3000);
                }
            }

            // ─── RENDER ───
            function render() {
                const size = getTileSize();
                const tileSize = size - gap;
                const boardWidth = boardEl.offsetWidth;

                // Clear board
                boardEl.querySelectorAll('.tile').forEach(el => el.remove());

                // Find positions for each tile value
                const positionMap = {};
                state.forEach((value, index) => {
                    positionMap[value] = index;
                });

                // Render tiles 1 to 8 (0 is empty)
                for (let value = 1; value <= 8; value++) {
                    const gridIndex = positionMap[value];
                    const pos = getPosition(gridIndex);
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.value = value;
                    tile.dataset.index = gridIndex;

                    // Position
                    tile.style.width = tileSize + 'px';
                    tile.style.height = tileSize + 'px';
                    tile.style.top = pos.top + 'px';
                    tile.style.left = pos.left + 'px';

                    // Background image
                    const correctIndex = value - 1;
                    const row = Math.floor(correctIndex / GRID_SIZE);
                    const col = correctIndex % GRID_SIZE;
                    if (imageLoaded) {
                        tile.style.backgroundImage = 'url(' + IMAGE_SRC + ')';
                        tile.style.backgroundSize = '300% 300%';
                        tile.style.backgroundPosition = `${col * 50}% ${row * 50}%`;
                    } else {
                        // Fallback: colorful tiles with numbers
                        const colors = ['#f8a4b8', '#c78bdb', '#f5c6a0', '#ffd6d6', '#d4b8e0', '#fce7f3', '#ffb3c6', '#b8d4e3'];
                        tile.style.background = colors[value - 1];
                        tile.style.border = '1px solid rgba(255,255,255,0.05)';
                        const label = document.createElement('span');
                        label.className = 'tile-label';
                        label.textContent = value;
                        tile.appendChild(label);
                    }

                    // Check if in correct position
                    if (gridIndex === correctIndex) {
                        tile.classList.add('correct');
                    }

                    tile.addEventListener('click', (e) => {
                        e.preventDefault();
                        onTileClick(gridIndex);
                    });

                    tile.addEventListener('touchstart', (e) => {
                        const touch = e.touches[0];
                        if (touch) {
                            onTileClick(gridIndex);
                        }
                        e.preventDefault();
                    }, { passive: false });

                    boardEl.appendChild(tile);
                }

                // Render empty tile (invisible, but clickable for debugging, or just a placeholder)
                const emptyPos = getPosition(emptyIndex);
                const emptyTile = document.createElement('div');
                emptyTile.className = 'tile empty';
                emptyTile.style.width = tileSize + 'px';
                emptyTile.style.height = tileSize + 'px';
                emptyTile.style.top = emptyPos.top + 'px';
                emptyTile.style.left = emptyPos.left + 'px';
                boardEl.appendChild(emptyTile);

                // Update moves display
                movesDisplay.textContent = moves;
            }

            // ─── MOVE LOGIC ───
            function onTileClick(index) {
                if (isComplete) return;
                if (isAdjacent(index, emptyIndex)) {
                    // Swap
                    state[emptyIndex] = state[index];
                    state[index] = 0;
                    emptyIndex = index;
                    moves++;
                    render();
                    checkWin();
                } else {
                    // Subtle feedback: shake or flash the tile
                    const tiles = boardEl.querySelectorAll('.tile');
                    tiles.forEach(t => {
                        if (parseInt(t.dataset.index) === index) {
                            t.style.transform = 'scale(0.92)';
                            t.style.borderColor = 'rgba(248,164,184,0.3)';
                            setTimeout(() => {
                                t.style.transform = '';
                                t.style.borderColor = '';
                            }, 150);
                        }
                    });
                }
            }

            function moveEmpty(direction) {
                // direction: 'up', 'down', 'left', 'right'
                // Move the tile in the opposite direction into the empty slot
                let targetIndex = -1;
                const row = Math.floor(emptyIndex / GRID_SIZE);
                const col = emptyIndex % GRID_SIZE;

                switch (direction) {
                    case 'up':
                        if (row > 0) targetIndex = emptyIndex - GRID_SIZE;
                        break;
                    case 'down':
                        if (row < GRID_SIZE - 1) targetIndex = emptyIndex + GRID_SIZE;
                        break;
                    case 'left':
                        if (col > 0) targetIndex = emptyIndex - 1;
                        break;
                    case 'right':
                        if (col < GRID_SIZE - 1) targetIndex = emptyIndex + 1;
                        break;
                }

                if (targetIndex !== -1) {
                    onTileClick(targetIndex);
                }
            }

            // ─── SHUFFLE ───
            function shufflePuzzle() {
                if (isComplete) {
                    completeOverlay.classList.remove('open');
                    isComplete = false;
                }
                // Reset to solved state first
                state = getSolvedState();
                emptyIndex = TOTAL_TILES - 1;
                moves = 0;

                // Perform 100-200 random valid moves
                const numMoves = 150 + Math.floor(Math.random() * 100);
                for (let i = 0; i < numMoves; i++) {
                    const neighbors = getNeighbors(emptyIndex);
                    const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                    state[emptyIndex] = state[randomNeighbor];
                    state[randomNeighbor] = 0;
                    emptyIndex = randomNeighbor;
                }
                // Reset move counter
                moves = 0;
                render();
                showToast('🔀 puzzle shuffled!');
            }

            function resetPuzzle() {
                if (isComplete) {
                    completeOverlay.classList.remove('open');
                    isComplete = false;
                }
                state = getSolvedState();
                emptyIndex = TOTAL_TILES - 1;
                moves = 0;
                render();
                showToast('✨ puzzle reset');
            }

            // ─── IMAGE LOAD ───
            function loadImage() {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = IMAGE_SRC;
                img.onload = function() {
                    imageLoaded = true;
                    state = getSolvedState();
                    emptyIndex = TOTAL_TILES - 1;
                    moves = 0;
                    render();
                    showToast('🧩 sliding puzzle ready!', 1500);
                    // Auto-shuffle after a moment
                    setTimeout(() => {
                        shufflePuzzle();
                    }, 500);
                };
                img.onerror = function() {
                    console.warn('Image not found, using numbered fallback');
                    imageLoaded = false;
                    state = getSolvedState();
                    emptyIndex = TOTAL_TILES - 1;
                    moves = 0;
                    render();
                    showToast('🧩 using numbered tiles', 1500);
                    setTimeout(() => {
                        shufflePuzzle();
                    }, 500);
                };
            }

            // ─── RESIZE ───
            function handleResize() {
                render();
            }

            // ─── EVENTS ───
            document.getElementById('shuffleBtn').addEventListener('click', shufflePuzzle);
            document.getElementById('resetBtn').addEventListener('click', resetPuzzle);
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                completeOverlay.classList.remove('open');
                isComplete = false;
                shufflePuzzle();
            });
            document.getElementById('backBtn').addEventListener('click', () => {
                window.location.href = 'index.html';
            });

            // Keyboard events
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                if (key === 'ArrowUp') { moveEmpty('down');
                    e.preventDefault(); } else if (key === 'ArrowDown') { moveEmpty('up');
                    e.preventDefault(); } else if (key === 'ArrowLeft') { moveEmpty('right');
                    e.preventDefault(); } else if (key === 'ArrowRight') { moveEmpty('left');
                    e.preventDefault(); }

                if (key === 'r' || key === 'R') {
                    resetPuzzle();
                    e.preventDefault();
                }
                if (key === 's' || key === 'S') {
                    shufflePuzzle();
                    e.preventDefault();
                }
                if (key === 'h' || key === 'H') {
                    window.location.href = 'index.html';
                }
                if (key === 'Enter' || key === ' ') {
                    if (completeOverlay.classList.contains('open')) {
                        completeOverlay.classList.remove('open');
                        isComplete = false;
                        shufflePuzzle();
                        e.preventDefault();
                    }
                }
            });

            // Resize handler with debounce
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(handleResize, 200);
            });

            // ─── AMBIENT CLICK SPARKLES ───
            document.addEventListener('click', function(e) {
                const tag = e.target.tagName.toLowerCase();
                if (tag === 'button' || tag === 'a' || e.target.closest('.tile') || e.target.closest('.overlay')) return;
                if (Math.random() > 0.35) return;
                sparkleBurst(e.clientX, e.clientY, 4);
            });

            // ─── INIT ───
            loadImage();
            console.log('🧩 Ruth\'s 21st Sliding Puzzle');
            console.log('📸 Image: ' + IMAGE_SRC);
            console.log('🎮 Click tiles or use arrow keys to slide');
        })();
    </script>

</body>
</html>
