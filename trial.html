<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Day 08 · Ruth's 21st · Our Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Patrick+Hand&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0a12;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .story-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9 / 16;
            background: #1a1625;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        #storyCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .lyric-overlay {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 14px 20px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
        }

        .lyric-overlay.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .lyric-overlay .lyric-text {
            font-family: 'Patrick Hand', cursive;
            font-size: clamp(0.85rem, 3.2vw, 1.3rem);
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.02em;
            line-height: 1.5;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .lyric-overlay .lyric-text .highlight {
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .lyric-overlay .lyric-time {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 4px;
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 12px;
            right: 16px;
            z-index: 20;
            display: flex;
            gap: 8px;
            pointer-events: none;
        }

        .controls button {
            pointer-events: all;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 6px 14px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.6rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s ease;
            backdrop-filter: blur(8px);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
        }

        .controls button:active {
            transform: scale(0.92);
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            z-index: 15;
            pointer-events: none;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f8a4b8, #c78bdb, #f5c6a0);
            border-radius: 0 2px 2px 0;
            transition: width 0.1s linear;
        }

        .start-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(13, 10, 18, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px 30px;
            text-align: center;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.04);
        }

        .start-overlay .big-emoji {
            font-size: 4rem;
            margin-bottom: 6px;
            animation: float 2.8s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .start-overlay h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb, #f5c6a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .start-overlay .sub {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 6px;
        }

        .start-overlay .story-desc {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            max-width: 280px;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .start-overlay .btn-play {
            padding: 14px 52px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 40px rgba(199, 139, 219, 0.2);
            transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.02em;
            touch-action: manipulation;
        }

        .start-overlay .btn-play:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 50px rgba(199, 139, 219, 0.3);
        }

        .start-overlay .btn-play:active {
            transform: scale(0.94);
        }

        .start-overlay .btn-back {
            margin-top: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s ease;
            padding: 4px 16px;
            border-radius: 20px;
            text-decoration: none;
        }

        .start-overlay .btn-back:hover {
            color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }

        @media (max-width: 420px) {
            .story-container {
                border-radius: 0;
                max-width: 100%;
            }
            .start-overlay h1 {
                font-size: 2rem;
            }
            .start-overlay .big-emoji {
                font-size: 3.2rem;
            }
            .lyric-overlay {
                bottom: 20px;
                padding: 10px 14px 12px;
                width: 92%;
            }
            .lyric-overlay .lyric-text {
                font-size: 0.8rem;
            }
        }

        @media (max-height: 700px) {
            .start-overlay h1 {
                font-size: 1.8rem;
            }
            .start-overlay .big-emoji {
                font-size: 2.8rem;
            }
            .start-overlay .story-desc {
                font-size: 0.65rem;
                margin-bottom: 14px;
            }
            .start-overlay .btn-play {
                padding: 10px 40px;
                font-size: 0.85rem;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .story-container {
                max-width: 80vh;
                aspect-ratio: 9 / 16;
            }
        }
    </style>
</head>
<body>

    <div class="story-container" id="container">
        <canvas id="storyCanvas"></canvas>

        <div class="lyric-overlay" id="lyricOverlay">
            <div class="lyric-text" id="lyricText">🎵 <span class="highlight">You've got a friend in me</span></div>
            <span class="lyric-time" id="lyricTime">0:00</span>
        </div>

        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <div class="controls">
            <button id="restartBtn">↻ restart</button>
        </div>

        <div class="start-overlay" id="startOverlay">
            <div class="big-emoji">💕</div>
            <h1>Our Story</h1>
            <div class="sub">— Ruth's 21st Celebration —</div>
            <div class="story-desc">
                A gentle walk, a flower, and a ride into forever<br />
                ✨ A love story in 2 minutes ✨
            </div>
            <button class="btn-play" id="playBtn">▶ play story</button>
            <button class="btn-back" id="homeBtn">← back to celebration</button>
        </div>
    </div>

    <audio id="player" preload="metadata"></audio>

    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('storyCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('container');

            let W, H, dpr;

            function resize() {
                const rect = container.getBoundingClientRect();
                dpr = devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                W = rect.width;
                H = rect.height;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }
            resize();
            window.addEventListener('resize', resize);

            const audio = document.getElementById('player');
            audio.src = 'friend.mp3';
            audio.preload = 'metadata';
            audio.onerror = () => { console.warn('Audio not available — story plays with visual only'); };

            // ─── STATE ───
            let isPlaying = false;
            let startTime = 0;
            let elapsed = 0;
            let animFrame = null;
            let totalDuration = 22;

            // ─── LYRICS ───
            const LYRICS = [
                { time: 0.0, text: "🎵 You've got a friend in me" },
                { time: 4.5, text: "🎵 You've got a friend in me" },
                { time: 9.0, text: "When the road looks rough ahead" },
                { time: 13.5, text: "And you're miles and miles from your nice warm bed" },
                { time: 19.0, text: "You just remember what your old pal said" },
                { time: 24.0, text: "Boy, you've got a friend in me" },
                { time: 28.5, text: "Yeah, you've got a friend in me" },
                { time: 33.0, text: "If you've got troubles, I've got 'em too" },
                { time: 38.0, text: "There isn't anything I wouldn't do for you" },
                { time: 43.0, text: "We stick together and we see it through" },
                { time: 48.0, text: "'Cause you've got a friend in me" },
                { time: 52.5, text: "Yeah, you've got a friend in me" },
            ];

            // ─── BILLBOARD MESSAGES ───
            const BILLBOARD_MSGS = [
                "✨ Forever Starts Today ✨",
                "💕 You & Me, Always 💕",
                "🌹 Every Love Story is Beautiful",
                "🌟 Together is Our Favorite Place",
                "💫 Two Hearts, One Journey",
                "🌸 Love is in the Air",
                "💖 You've Got a Friend in Me",
                "🌅 The Best Ride of Our Lives",
                "💞 Ruth & Her Forever",
                "🎵 Our Song, Our Story"
            ];

            // ─── SCENE TIMELINE ───
            // phase 0: guy walks in with flowers (0-2.5s)
            // phase 1: opens door, lady gets in (2.5-5s)
            // phase 2: guy walks to driver side, gets in (5-7.5s)
            // phase 3: car starts driving (7.5-10s)
            // phase 4: driving on road, billboard, cars pass (10-16s)
            // phase 5: romantic lean-in, arm around (16-19s)
            // phase 6: finale (19-22s)

            // ─── DRAWING HELPERS ───

            function roundRect(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }

            // ─── DRAW ROAD (perspective, 5 lanes) ───
            function drawRoad(progress, time) {
                // sky gradient
                const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
                const sunset = Math.min(progress * 0.8, 0.6);
                skyGrad.addColorStop(0, `rgba(25, 15, 45, ${1 - sunset * 0.3})`);
                skyGrad.addColorStop(0.4, `rgba(80, 40, 80, ${1 - sunset * 0.4})`);
                skyGrad.addColorStop(0.7, `rgba(180, 80, 60, ${1 - sunset * 0.3})`);
                skyGrad.addColorStop(1, `rgba(220, 140, 80, ${1 - sunset * 0.2})`);
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H * 0.6);

                // sun
                const sunX = W * 0.7 + Math.sin(time * 0.1) * 20;
                const sunY = H * 0.22 - progress * 10;
                const sunR = 28 + Math.sin(time * 0.5) * 2;
                const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 2.5);
                sunGrad.addColorStop(0, 'rgba(255, 200, 100, 0.6)');
                sunGrad.addColorStop(0.3, 'rgba(255, 150, 50, 0.3)');
                sunGrad.addColorStop(1, 'rgba(255, 100, 20, 0)');
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(sunX, sunY, sunR * 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255, 220, 140, 0.8)';
                ctx.beginPath();
                ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
                ctx.fill();

                // clouds
                for (let i = 0; i < 4; i++) {
                    const cx = (i * 130 + time * 8) % (W + 80) - 40;
                    const cy = 20 + i * 25 + Math.sin(time * 0.3 + i * 1.5) * 8;
                    const cs = 0.6 + Math.sin(time * 0.2 + i) * 0.15;
                    ctx.fillStyle = `rgba(255,255,255,${0.06 + Math.sin(time * 0.1 + i) * 0.02})`;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 18 * cs, 0, Math.PI * 2);
                    ctx.arc(cx + 22 * cs, cy - 8 * cs, 22 * cs, 0, Math.PI * 2);
                    ctx.arc(cx + 44 * cs, cy, 18 * cs, 0, Math.PI * 2);
                    ctx.arc(cx + 22 * cs, cy + 4 * cs, 16 * cs, 0, Math.PI * 2);
                    ctx.fill();
                }

                // ground / hills
                ctx.fillStyle = 'rgba(40, 70, 40, 0.6)';
                ctx.beginPath();
                ctx.moveTo(0, H * 0.6);
                for (let x = 0; x <= W; x += 2) {
                    const y = H * 0.6 + Math.sin(x * 0.008 + time * 0.05) * 12 + Math.sin(x * 0.02 + time * 0.03) * 6;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(W, H);
                ctx.lineTo(0, H);
                ctx.fill();

                ctx.fillStyle = 'rgba(50, 80, 50, 0.5)';
                ctx.beginPath();
                ctx.moveTo(0, H * 0.65);
                for (let x = 0; x <= W; x += 2) {
                    const y = H * 0.65 + Math.sin(x * 0.01 + time * 0.04 + 1) * 10 + Math.sin(x * 0.025 + time * 0.02) * 5;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(W, H);
                ctx.lineTo(0, H);
                ctx.fill();

                // ROAD (5 lanes, perspective)
                const vpX = W * 0.5;
                const vpY = H * 0.38;
                const roadW = W * 0.9;

                // road surface
                ctx.fillStyle = '#2a2a2e';
                ctx.beginPath();
                ctx.moveTo(vpX - 8, vpY);
                ctx.lineTo(vpX + 8, vpY);
                ctx.lineTo(vpX + roadW * 0.55, H);
                ctx.lineTo(vpX - roadW * 0.55, H);
                ctx.fill();

                // road edge glow
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(vpX - 8, vpY);
                ctx.lineTo(vpX - roadW * 0.55, H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(vpX + 8, vpY);
                ctx.lineTo(vpX + roadW * 0.55, H);
                ctx.stroke();

                // lane dividers (4 lines for 5 lanes)
                const laneCount = 5;
                for (let lane = 1; lane < laneCount; lane++) {
                    const t = lane / laneCount;
                    const leftX = vpX - 8 + (vpX - roadW * 0.55 - vpX + 8) * t;
                    const rightX = vpX + 8 + (vpX + roadW * 0.55 - vpX - 8) * t;
                    const centerX = (leftX + rightX) / 2;

                    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([12, 18]);
                    ctx.beginPath();
                    ctx.moveTo(centerX, vpY + 10);
                    ctx.lineTo(centerX, H);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // road edge lines
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(vpX - 8, vpY);
                ctx.lineTo(vpX - roadW * 0.55 + 4, H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(vpX + 8, vpY);
                ctx.lineTo(vpX + roadW * 0.55 - 4, H);
                ctx.stroke();

                // ─── OTHER CARS ON ROAD ───
                const carPositions = [
                    { lane: 0, offset: 0.2, speed: 0.4, color: '#c0392b', size: 0.7 },
                    { lane: 1, offset: 0.5, speed: -0.3, color: '#2980b9', size: 0.8 },
                    { lane: 2, offset: 0.8, speed: 0.5, color: '#27ae60', size: 0.6 },
                    { lane: 3, offset: 0.1, speed: -0.6, color: '#8e44ad', size: 0.7 },
                    { lane: 4, offset: 0.6, speed: 0.35, color: '#d35400', size: 0.65 },
                    { lane: 0, offset: 0.9, speed: -0.45, color: '#2c3e50', size: 0.5 },
                    { lane: 3, offset: 0.4, speed: 0.55, color: '#e74c3c', size: 0.6 },
                ];

                const driveProgress = Math.max(0, Math.min((progress - 0.3) / 0.7, 1));
                const speedFactor = 0.5 + driveProgress * 0.5;

                for (const cp of carPositions) {
                    const laneT = (cp.lane + 0.5) / laneCount;
                    const leftX = vpX - 8 + (vpX - roadW * 0.55 - vpX + 8) * laneT;
                    const rightX = vpX + 8 + (vpX + roadW * 0.55 - vpX - 8) * laneT;
                    const centerX = (leftX + rightX) / 2;
                    const laneWidth = rightX - leftX;

                    // vertical position on road (perspective)
                    const rawPos = (cp.offset + time * cp.speed * speedFactor * 0.08) % 1;
                    const yPos = vpY + (H - vpY) * rawPos;

                    if (yPos > vpY + 10 && yPos < H - 5) {
                        const scale = 0.15 + 0.85 * (1 - (yPos - vpY) / (H - vpY));
                        const carW = laneWidth * 0.5 * scale * 0.8;
                        const carH = carW * 0.45;

                        // car body
                        const cx = centerX;
                        const cy = yPos;
                        const s = scale * 0.9;

                        ctx.save();
                        ctx.translate(cx, cy);
                        ctx.scale(s, s);

                        // shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.15)';
                        ctx.beginPath();
                        ctx.ellipse(0, carH * 1.1, carW * 0.7, carH * 0.15, 0, 0, Math.PI * 2);
                        ctx.fill();

                        // body
                        ctx.fillStyle = cp.color;
                        ctx.shadowColor = 'rgba(0,0,0,0.2)';
                        ctx.shadowBlur = 6;
                        const bw = carW * 1.8;
                        const bh = carH * 1.2;
                        ctx.beginPath();
                        roundRect(-bw / 2, -bh / 2, bw, bh, 4);
                        ctx.fill();

                        // roof/window
                        ctx.fillStyle = 'rgba(100,180,255,0.15)';
                        ctx.shadowBlur = 0;
                        ctx.beginPath();
                        roundRect(-bw * 0.3, -bh * 0.7, bw * 0.6, bh * 0.4, 3);
                        ctx.fill();

                        // lights
                        ctx.fillStyle = 'rgba(255,200,100,0.3)';
                        ctx.beginPath();
                        ctx.arc(bw * 0.45, -bh * 0.2, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(bw * 0.45, bh * 0.2, 3, 0, Math.PI * 2);
                        ctx.fill();

                        // wheels
                        ctx.fillStyle = '#1a1a1a';
                        ctx.shadowBlur = 4;
                        ctx.beginPath();
                        ctx.arc(-bw * 0.35, bh * 0.55, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(bw * 0.35, bh * 0.55, 4, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.restore();
                    }
                }
            }

            // ─── DRAW CONVERTIBLE FROM BEHIND ───
            function drawConvertible(progress, time, guyLean, armAround, driveProgress) {
                const cx = W * 0.5;
                const cy = H * 0.7 + Math.sin(time * 0.5) * 2;

                const carW = W * 0.52;
                const carH = carW * 0.45;

                ctx.save();
                ctx.translate(cx, cy);

                // shadow
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(0, carH * 0.55, carW * 0.7, carH * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();

                // ─── CAR BODY ───
                // rear bumper
                ctx.fillStyle = '#1a1a1e';
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                roundRect(-carW * 0.48, -carH * 0.2, carW * 0.96, carH * 0.6, 8);
                ctx.fill();

                // main body (red convertible)
                const bodyColor = '#b31b1b';
                ctx.fillStyle = bodyColor;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                roundRect(-carW * 0.44, -carH * 0.4, carW * 0.88, carH * 0.8, 6);
                ctx.fill();

                // rear deck
                ctx.fillStyle = '#8a1515';
                ctx.beginPath();
                roundRect(-carW * 0.4, -carH * 0.38, carW * 0.8, carH * 0.3, 4);
                ctx.fill();

                // trunk line
                ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-carW * 0.35, -carH * 0.12);
                ctx.lineTo(carW * 0.35, -carH * 0.12);
                ctx.stroke();

                // ─── TAILLIGHTS ───
                const tlColor = 'rgba(255,30,30,0.7)';
                ctx.shadowBlur = 12;
                ctx.shadowColor = 'rgba(255,0,0,0.3)';
                ctx.fillStyle = tlColor;
                ctx.beginPath();
                roundRect(-carW * 0.4, -carH * 0.22, carW * 0.08, carH * 0.12, 3);
                ctx.fill();
                ctx.beginPath();
                roundRect(carW * 0.32, -carH * 0.22, carW * 0.08, carH * 0.12, 3);
                ctx.fill();

                // brake lights (brighter when driving)
                const brake = driveProgress > 0.3 ? 0.6 : 0.2;
                ctx.fillStyle = `rgba(255,50,50,${brake})`;
                ctx.shadowBlur = 20;
                ctx.shadowColor = `rgba(255,0,0,${brake * 0.3})`;
                ctx.beginPath();
                roundRect(-carW * 0.38, -carW * 0.04, carW * 0.06, carW * 0.06, 2);
                ctx.fill();
                ctx.beginPath();
                roundRect(carW * 0.32, -carW * 0.04, carW * 0.06, carW * 0.06, 2);
                ctx.fill();

                ctx.shadowBlur = 0;

                // ─── SEATS (from behind) ───
                const seatW = carW * 0.28;
                const seatH = carH * 0.5;
                const seatY = -carH * 0.3;

                // driver seat (left side) - guy
                ctx.fillStyle = '#2a2a2e';
                ctx.beginPath();
                roundRect(-carW * 0.3, seatY, seatW, seatH, 4);
                ctx.fill();

                // passenger seat (right side) - lady
                ctx.fillStyle = '#2a2a2e';
                ctx.beginPath();
                roundRect(carW * 0.02, seatY, seatW, seatH, 4);
                ctx.fill();

                // headrests
                ctx.fillStyle = '#1a1a1e';
                ctx.beginPath();
                roundRect(-carW * 0.26, seatY - seatH * 0.35, seatW * 0.35, seatH * 0.2, 3);
                ctx.fill();
                ctx.beginPath();
                roundRect(carW * 0.06, seatY - seatH * 0.35, seatW * 0.35, seatH * 0.2, 3);
                ctx.fill();

                // ─── CHARACTERS (from behind) ───

                // GUY (driver, left side) - dark brown skin
                const guyX = -carW * 0.18;
                const guyY = seatY - seatH * 0.1;

                // guy body from behind
                ctx.save();
                ctx.translate(guyX, guyY);

                // shoulders / body
                const bodyW = seatW * 0.75;
                const bodyH = seatH * 0.7;
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath();
                roundRect(-bodyW / 2, -bodyH * 0.1, bodyW, bodyH, 8);
                ctx.fill();

                // shirt (dark)
                ctx.fillStyle = '#1a1a2a';
                ctx.beginPath();
                roundRect(-bodyW * 0.4, -bodyH * 0.05, bodyW * 0.8, bodyH * 0.7, 4);
                ctx.fill();

                // head (dark brown skin)
                const headR = seatW * 0.3;
                ctx.fillStyle = '#6a3a2a';
                ctx.beginPath();
                ctx.arc(0, -bodyH * 0.35, headR, 0, Math.PI * 2);
                ctx.fill();

                // hair (short, dark)
                ctx.fillStyle = '#2a1a0a';
                ctx.beginPath();
                ctx.arc(0, -bodyH * 0.45, headR * 0.9, Math.PI, 2 * Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-headR * 0.5, -bodyH * 0.4, headR * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(headR * 0.5, -bodyH * 0.4, headR * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // arm (left arm on steering wheel, right arm around lady)
                ctx.strokeStyle = '#6a3a2a';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';

                // left arm (on steering wheel)
                ctx.beginPath();
                ctx.moveTo(-bodyW * 0.4, -bodyH * 0.1);
                ctx.lineTo(-bodyW * 0.6, -bodyH * 0.25);
                ctx.stroke();

                // right arm - goes around lady if armAround > 0
                const armExtend = 0.3 + armAround * 0.5;
                ctx.beginPath();
                ctx.moveTo(bodyW * 0.4, -bodyH * 0.1);
                ctx.lineTo(bodyW * 0.4 + carW * 0.15 * armExtend, -bodyH * 0.2 - carH * 0.05 * armAround);
                ctx.stroke();

                // if arm around, draw hand on her shoulder
                if (armAround > 0.3) {
                    ctx.fillStyle = '#6a3a2a';
                    ctx.beginPath();
                    ctx.arc(bodyW * 0.4 + carW * 0.15 * armExtend, -bodyH * 0.2 - carH * 0.05 * armAround, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();

                // ─── LADY (passenger, right side) - white skin ───
                const ladyX = carW * 0.18;
                const ladyY = seatY - seatH * 0.1;

                ctx.save();
                ctx.translate(ladyX, ladyY);

                // lean in toward guy
                const leanX = -guyLean * 8;
                const leanRot = -guyLean * 0.04;

                ctx.translate(leanX, 0);
                ctx.rotate(leanRot);

                // shoulders / body
                const lBodyW = seatW * 0.7;
                const lBodyH = seatH * 0.65;
                ctx.fillStyle = '#f0d5c0';
                ctx.beginPath();
                roundRect(-lBodyW / 2, -lBodyH * 0.1, lBodyW, lBodyH, 8);
                ctx.fill();

                // dress (light pink/white)
                ctx.fillStyle = '#f5d0d8';
                ctx.beginPath();
                roundRect(-lBodyW * 0.45, -lBodyH * 0.05, lBodyW * 0.9, lBodyH * 0.75, 4);
                ctx.fill();

                // head (white skin)
                const lHeadR = seatW * 0.28;
                ctx.fillStyle = '#f0d5c0';
                ctx.beginPath();
                ctx.arc(0, -lBodyH * 0.35, lHeadR, 0, Math.PI * 2);
                ctx.fill();

                // hair (long, blonde/light brown)
                ctx.fillStyle = '#c8a060';
                // hair flowing down
                ctx.beginPath();
                ctx.arc(0, -lBodyH * 0.45, lHeadR * 1.0, Math.PI, 2 * Math.PI);
                ctx.fill();
                // long hair strands
                for (let i = -3; i <= 3; i++) {
                    const angle = Math.PI / 2 + i * 0.12;
                    const hx = Math.sin(angle) * lHeadR * 0.8;
                    const hy = -lBodyH * 0.35 + Math.cos(angle) * lHeadR * 0.8;
                    ctx.beginPath();
                    ctx.moveTo(hx, hy);
                    const len = 20 + Math.sin(i * 0.7 + time) * 5;
                    ctx.quadraticCurveTo(hx + i * 4, hy + len * 0.6, hx + i * 2, hy + len);
                    ctx.strokeStyle = '#c8a060';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // hair bow
                ctx.fillStyle = '#f5a0b8';
                ctx.beginPath();
                ctx.ellipse(lHeadR * 0.7, -lBodyH * 0.5, 6, 4, 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(lHeadR * 0.8, -lBodyH * 0.48, 6, 4, -0.4, 0, Math.PI * 2);
                ctx.fill();

                // blush
                ctx.fillStyle = 'rgba(245,160,184,0.15)';
                ctx.beginPath();
                ctx.arc(-lHeadR * 0.5, -lBodyH * 0.3, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(lHeadR * 0.5, -lBodyH * 0.3, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // ─── STEERING WHEEL (visible from behind, left side) ───
                ctx.save();
                ctx.translate(-carW * 0.25, seatY + seatH * 0.05);
                ctx.fillStyle = 'rgba(30,30,35,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 0, carW * 0.08, carW * 0.04, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(40,40,45,0.2)';
                ctx.beginPath();
                ctx.ellipse(0, 0, carW * 0.06, carW * 0.03, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // ─── WINDSHIELD (from behind, subtle) ───
                ctx.strokeStyle = 'rgba(150,200,255,0.03)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-carW * 0.32, -carH * 0.45);
                ctx.quadraticCurveTo(0, -carH * 0.55, carW * 0.32, -carH * 0.45);
                ctx.stroke();

                // ─── REAR VIEW MIRROR ───
                ctx.fillStyle = 'rgba(40,40,45,0.1)';
                ctx.beginPath();
                ctx.ellipse(0, -carH * 0.45, carW * 0.04, carW * 0.025, 0, 0, Math.PI * 2);
                ctx.fill();

                // ─── LICENSE PLATE ───
                ctx.fillStyle = 'rgba(255,255,255,0.03)';
                ctx.fillRect(-carW * 0.06, carH * 0.3, carW * 0.12, carH * 0.06);
                ctx.fillStyle = 'rgba(255,255,255,0.02)';
                ctx.font = `${carH * 0.04}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillText('RUTH 21', 0, carH * 0.345);

                ctx.restore();

                // ─── BILLBOARD (top area) ───
                drawBillboard(progress, time);
            }

            // ─── BILLBOARD ───
            function drawBillboard(progress, time) {
                const msgIndex = Math.floor((time * 0.2) % BILLBOARD_MSGS.length);
                const msg = BILLBOARD_MSGS[msgIndex];
                const nextMsg = BILLBOARD_MSGS[(msgIndex + 1) % BILLBOARD_MSGS.length];
                const blend = (time * 0.2) % 1;

                const bx = W * 0.08;
                const by = H * 0.04;
                const bw = W * 0.84;
                const bh = H * 0.12;

                // billboard frame
                ctx.save();

                // shadow
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 20;
                ctx.fillStyle = 'rgba(20,18,25,0.6)';
                ctx.beginPath();
                roundRect(bx, by, bw, bh, 6);
                ctx.fill();
                ctx.shadowBlur = 0;

                // border glow
                ctx.strokeStyle = 'rgba(255,200,150,0.04)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                roundRect(bx, by, bw, bh, 6);
                ctx.stroke();

                // gradient background
                const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
                grad.addColorStop(0, 'rgba(40,20,50,0.5)');
                grad.addColorStop(0.5, 'rgba(60,30,70,0.4)');
                grad.addColorStop(1, 'rgba(40,20,50,0.5)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                roundRect(bx + 4, by + 4, bw - 8, bh - 8, 4);
                ctx.fill();

                // message text with crossfade
                const alpha1 = 1 - blend;
                const alpha2 = blend;

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `bold ${bh * 0.35}px "Playfair Display", serif`;

                // current message
                ctx.fillStyle = `rgba(255,220,200,${alpha1 * 0.7})`;
                ctx.fillText(msg, W * 0.5, by + bh * 0.5);

                // next message (fading in)
                ctx.fillStyle = `rgba(255,220,200,${alpha2 * 0.7})`;
                ctx.fillText(nextMsg, W * 0.5, by + bh * 0.5);

                // small decorative line
                ctx.strokeStyle = `rgba(255,200,150,${0.05 + Math.sin(time * 0.5) * 0.02})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(W * 0.3, by + bh * 0.82);
                ctx.lineTo(W * 0.7, by + bh * 0.82);
                ctx.stroke();

                ctx.restore();
            }

            // ─── SCENE 0: GUY WALKS IN WITH FLOWERS ───
            function drawScene0(progress, time) {
                // background
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#1a0a2a');
                grad.addColorStop(0.4, '#2a1a3a');
                grad.addColorStop(0.7, '#4a2a3a');
                grad.addColorStop(1, '#2a1a0a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // ground
                ctx.fillStyle = 'rgba(30,25,20,0.6)';
                ctx.fillRect(0, H * 0.75, W, H * 0.25);

                // car (parked)
                drawConvertible(0, time, 0, 0, 0);

                // guy walking in from right
                const walkX = W * 0.6 + (1 - progress) * W * 0.5;
                const walkY = H * 0.6 - Math.sin(progress * 8) * 4;
                const step = Math.sin(progress * 10) * 0.3;

                // draw guy walking
                ctx.save();
                ctx.translate(walkX, walkY);

                // shadow
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(0, 20, 16, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                // body
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath();
                roundRect(-10, -16, 20, 32, 4);
                ctx.fill();

                // shirt
                ctx.fillStyle = '#1a1a2a';
                ctx.beginPath();
                roundRect(-8, -14, 16, 24, 3);
                ctx.fill();

                // legs
                ctx.strokeStyle = '#2a1a0a';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-4, 14);
                ctx.lineTo(-4 + Math.sin(step) * 6, 28 + Math.cos(step) * 4);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(4, 14);
                ctx.lineTo(4 + Math.sin(-step) * 6, 28 + Math.cos(-step) * 4);
                ctx.stroke();

                // arms (carrying flowers)
                ctx.strokeStyle = '#6a3a2a';
                ctx.lineWidth = 4;
                // right arm holding flowers forward
                ctx.beginPath();
                ctx.moveTo(10, -8);
                ctx.lineTo(20 + Math.sin(progress * 6) * 2, -2);
                ctx.stroke();
                // left arm swinging
                ctx.beginPath();
                ctx.moveTo(-10, -8);
                ctx.lineTo(-18 + Math.sin(step) * 4, -2);
                ctx.stroke();

                // head (dark brown)
                ctx.fillStyle = '#6a3a2a';
                ctx.beginPath();
                ctx.arc(0, -24, 12, 0, Math.PI * 2);
                ctx.fill();

                // hair
                ctx.fillStyle = '#2a1a0a';
                ctx.beginPath();
                ctx.arc(0, -28, 13, Math.PI, 2 * Math.PI);
                ctx.fill();

                // flowers in hand
                ctx.fillStyle = '#f5a0b8';
                ctx.beginPath();
                ctx.arc(22 + Math.sin(progress * 6) * 2, -6 + Math.sin(progress * 4) * 2, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f5c6a0';
                ctx.beginPath();
                ctx.arc(26 + Math.sin(progress * 6 + 1) * 2, -4 + Math.sin(progress * 4 + 1) * 2, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#c78bdb';
                ctx.beginPath();
                ctx.arc(24 + Math.sin(progress * 6 + 2) * 2, -10 + Math.sin(progress * 4 + 2) * 2, 5, 0, Math.PI * 2);
                ctx.fill();

                // smile
                ctx.strokeStyle = '#3a1a0a';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, -20, 5, 0.1, Math.PI - 0.1);
                ctx.stroke();

                ctx.restore();

                // "For you 💐" text
                const alpha = Math.min(progress * 2, 1);
                ctx.fillStyle = `rgba(255,200,180,${alpha * 0.15})`;
                ctx.font = '14px "Patrick Hand", cursive';
                ctx.textAlign = 'center';
                ctx.fillText('💐 For you, my love', W * 0.5, H * 0.12);
            }

            function drawScene1(progress, time) {

            // ─── SCENE 2: GUY WALKS TO DRIVER SIDE ───

                ctx.fillRect(0, H * 0.75, W, H * 0.25);

                // car with lady inside
                drawConvertible(0, time, 0, 0, 0);

                // guy walking around the back to driver side
                const walkProg = Math.min(progress * 1.2, 1);
                const walkX = W * 0.35 + walkProg * W * 0.3;
                const walkY = H * 0.6 - Math.sin(walkProg * 6) * 3;

                ctx.translate(walkX, walkY);

                // shadow

                ctx.beginPath();
                ctx.ellipse(0, 18, 12, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                // body
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath();
                roundRect(-8, -12, 16, 26, 4);
                ctx.fill();
                ctx.fillStyle = '#1a1a2a';
                ctx.beginPath();
                roundRect(-6, -10, 12, 20, 3);
                ctx.fill();

                // legs walking
                const step2 = Math.sin(walkProg * 8) * 0.4;
                ctx.strokeStyle = '#2a1a0a';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-3, 12);
                ctx.lineTo(-3 + Math.sin(step2) * 5, 24 + Math.cos(step2) * 3);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(3, 12);
                ctx.lineTo(3 + Math.sin(-step2) * 5, 24 + Math.cos(-step2) * 3);
                ctx.stroke();

                // arms
                ctx.strokeStyle = '#6a3a2a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(-8, -4);
                ctx.lineTo(-14 + Math.sin(walkProg * 4) * 3, 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(8, -4);
                ctx.lineTo(14 + Math.sin(walkProg * 4 + 1) * 3, 2);
                ctx.stroke();

                // head
                ctx.fillStyle = '#6a3a2a';
                ctx.beginPath();
                ctx.arc(0, -20, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2a1a0a';
                ctx.beginPath();
                ctx.arc(0, -24, 11, Math.PI, 2 * Math.PI);
                ctx.fill();

                // smile
                ctx.strokeStyle = '#3a1a0a';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, -16, 4, 0.1, Math.PI - 0.1);
                ctx.stroke();

                ctx.restore();

                // "Let's go! 🚗" text
                const alpha = Math.min(progress * 1.5, 1);
                ctx.fillStyle = `rgba(255,200,180,${alpha * 0.1})`;
                ctx.font = '13px "Patrick Hand", cursive';
                ctx.textAlign = 'center';
                ctx.fillText('🚗 Let\'s go!', W * 0.5, H * 0.1);
            }

            // ─── SCENE 3: DRIVING ───
            function drawScene3(progress, time) {
                const driveProg = Math.min(progress, 1);
                drawRoad(driveProg, time);
                drawConvertible(progress, time, 0, 0, driveProg);

                // speed lines
                if (driveProg > 0.3) {
                    const intensity = (driveProg - 0.3) * 0.6;
                    for (let i = 0; i < 10; i++) {
                        const lx = (i / 10) * W + Math.sin(time * 2 + i * 1.5) * 20;
                        const ly = H * 0.4 + Math.random() * H * 0.3;
                        ctx.strokeStyle = `rgba(255,255,255,${intensity * 0.01 + Math.random() * 0.01})`;
                        ctx.lineWidth = 1 + Math.random();
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(lx + 10 + Math.random() * 20, ly);
                        ctx.stroke();
                    }
                }
            }

            // ─── SCENE 4: ROMANTIC MOMENT ───
            function drawScene4(progress, time) {
                const driveProg = 0.7 + progress * 0.3;
                drawRoad(Math.min(driveProg, 1), time);

                const leanIn = Math.min(progress * 2.5, 1);
                const armAround = Math.min((progress - 0.2) * 3, 1);

                drawConvertible(progress, time, leanIn, armAround, Math.min(driveProg, 1));

                // hearts floating
                for (let i = 0; i < 6; i++) {
                    const hx = W * 0.2 + Math.sin(time * 1.5 + i * 2.1) * W * 0.3 + i * 15;
                    const hy = H * 0.15 + Math.sin(time * 1.2 + i * 1.7) * 30 + i * 8;
                    const hs = 0.4 + Math.sin(time + i * 0.7) * 0.15;
                    const alpha = 0.06 + Math.sin(time * 1.5 + i) * 0.03 + 0.04;
                    ctx.fillStyle = `rgba(245,160,184,${alpha})`;
                    ctx.font = `${14 * hs}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText('❤️', hx, hy);
                }

                // "You've got a friend in me" text overlay
                const textAlpha = 0.08 + Math.sin(time * 0.5) * 0.03;
                ctx.fillStyle = `rgba(255,220,200,${textAlpha})`;
                ctx.font = 'bold 16px "Patrick Hand", cursive';
                ctx.textAlign = 'center';
                ctx.fillText('💕 You\'ve got a friend in me 💕', W * 0.5, H * 0.08);
            }

            // ─── SCENE 5: FINALE ───
            function drawScene5(progress, time) {
                const driveProg = 0.85 + progress * 0.15;
                drawRoad(Math.min(driveProg, 1), time);

                const leanIn = 1;
                const armAround = 1;
                drawConvertible(progress, time, leanIn, armAround, Math.min(driveProg, 1));

                // big heart
                const heartScale = 1 + Math.sin(time * 1.5) * 0.04;
                ctx.save();
                ctx.translate(W * 0.5, H * 0.32);
                ctx.scale(heartScale, heartScale);
                ctx.fillStyle = 'rgba(245,160,184,0.04)';
                ctx.font = '80px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('❤️', 0, 0);
                ctx.restore();

                // "Forever & Always"
                const fa = 0.08 + Math.sin(time * 0.8) * 0.03;
                ctx.fillStyle = `rgba(255,215,200,${fa})`;
                ctx.font = 'bold 18px "Playfair Display", serif';
                ctx.textAlign = 'center';
                ctx.fillText('✨ Forever & Always ✨', W * 0.5, H * 0.88);

                // small hearts
                for (let i = 0; i < 12; i++) {
                    const hx = W * 0.1 + Math.sin(time * 1.3 + i * 2.3) * W * 0.4 + i * 6;
                    const hy = H * 0.1 + Math.sin(time * 1.0 + i * 1.9) * H * 0.25 + i * 5;
                    const hs = 0.2 + Math.sin(time + i * 0.5) * 0.08 + 0.12;
                    ctx.fillStyle = `rgba(245,160,184,${0.02 + Math.sin(time * 1.5 + i) * 0.015 + 0.015})`;
                    ctx.font = `${8 * hs}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.fillText('❤️', hx, hy);
                }

                // "The Beginning" text
                if (progress > 0.3) {
                    const ba = (progress - 0.3) * 1.5;
                    ctx.fillStyle = `rgba(255,215,0,${ba * 0.05})`;
                    ctx.font = '12px "Patrick Hand", cursive';
                    ctx.textAlign = 'center';
                    ctx.fillText('🌟 The Beginning 🌟', W * 0.5, H * 0.92);
                }
            }

            // ─── SCENE DISPATCH ───
            function drawScene(sceneIdx, progress, time) {
                switch (sceneIdx) {
                    case 0:
                        drawScene0(progress, time);
                        break;
                    case 1:
                        drawScene1(progress, time);
                        break;
                    case 2:
                        drawScene2(progress, time);
                        break;
                    case 3:
                        drawScene3(progress, time);
                        break;
                    case 4:
                        drawScene4(progress, time);
                        break;
                    case 5:
                        drawScene5(progress, time);
                        break;
                    default:
                        break;
                }
            }

            // ─── UPDATE LYRICS ───
            function updateLyrics(elapsed) {
                const overlay = document.getElementById('lyricOverlay');
                const textEl = document.getElementById('lyricText');
                const timeEl = document.getElementById('lyricTime');

                let currentLyric = null;
                for (let i = LYRICS.length - 1; i >= 0; i--) {
                    if (elapsed >= LYRICS[i].time) {
                        currentLyric = LYRICS[i];
                        break;
                    }
                }

                if (currentLyric && elapsed < 22) {
                    textEl.innerHTML = currentLyric.text;
                    const mins = Math.floor(currentLyric.time / 60);
                    const secs = Math.floor(currentLyric.time % 60);
                    timeEl.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
                    overlay.classList.add('show');
                } else if (elapsed >= 22) {
                    textEl.innerHTML = '💕 <span class="highlight">Forever & Always</span> 💕';
                    timeEl.textContent = '♥ 2:05';
                    overlay.classList.add('show');
                } else {
                    overlay.classList.remove('show');
                }
            }

            // ─── RENDER ───
            function render(timestamp) {
                if (!isPlaying) return;

                const now = performance.now();
                elapsed = (now - startTime) / 1000;

                if (elapsed > totalDuration) {
                    elapsed = totalDuration;
                }

                document.getElementById('progressFill').style.width = (elapsed / totalDuration * 100) + '%';

                // determine scene
                let sceneIdx = 0;
                let sceneProg = 0;
                const sceneTimes = [
                    { start: 0, end: 2.5 },
                    { start: 2.5, end: 5.0 },
                    { start: 5.0, end: 7.5 },
                    { start: 7.5, end: 11.0 },
                    { start: 11.0, end: 16.0 },
                    { start: 16.0, end: 22.0 },
                ];

                for (let i = 0; i < sceneTimes.length; i++) {
                    if (elapsed >= sceneTimes[i].start && elapsed < sceneTimes[i].end) {
                        sceneIdx = i;
                        sceneProg = (elapsed - sceneTimes[i].start) / (sceneTimes[i].end - sceneTimes[i].start);
                        break;
                    }
                    if (elapsed >= sceneTimes[i].end && i === sceneTimes.length - 1) {
                        sceneIdx = i;
                        sceneProg = 1;
                    }
                    if (elapsed >= sceneTimes[i].end && i < sceneTimes.length - 1) {
                        // continue to next
                    }
                }
                // clamp
                if (elapsed >= sceneTimes[sceneTimes.length - 1].end) {
                    sceneIdx = sceneTimes.length - 1;
                    sceneProg = 1;
                }

                ctx.clearRect(0, 0, W, H);

                // draw black background first
                ctx.fillStyle = '#0d0a12';
                ctx.fillRect(0, 0, W, H);

                drawScene(sceneIdx, sceneProg, elapsed);

                updateLyrics(elapsed);

                if (audio && !audio.paused) {
                    try {
                        const audioTime = audio.currentTime;
                        // drift correction if needed
                    } catch (_) {}
                }

                if (elapsed >= totalDuration) {
                    isPlaying = false;
                    if (audio) audio.pause();
                    document.getElementById('lyricOverlay').classList.add('show');
                    document.getElementById('lyricText').innerHTML = '💕 <span class="highlight">Forever & Always</span> 💕';
                    document.getElementById('lyricTime').textContent = '♥ 2:05';
                    return;
                }

                animFrame = requestAnimationFrame(render);
            }

            // ─── START / STOP ───
            function startStory() {
                if (isPlaying) return;
                isPlaying = true;
                startTime = performance.now();

                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                }

                document.getElementById('startOverlay').classList.add('hidden');

                if (animFrame) cancelAnimationFrame(animFrame);
                render(performance.now());
            }

            function stopStory() {
                isPlaying = false;
                if (audio) audio.pause();
                if (animFrame) cancelAnimationFrame(animFrame);
            }

            function resetStory() {
                stopStory();
                elapsed = 0;
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('lyricOverlay').classList.remove('show');
                document.getElementById('startOverlay').classList.remove('hidden');
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#0d0a12';
                ctx.fillRect(0, 0, W, H);
                document.getElementById('lyricText').innerHTML = '🎵 <span class="highlight">You\'ve got a friend in me</span>';
                document.getElementById('lyricTime').textContent = '0:00';
            }

            // ─── EVENTS ───
            document.getElementById('playBtn').addEventListener('click', startStory);
            document.getElementById('restartBtn').addEventListener('click', resetStory);
            document.getElementById('homeBtn').addEventListener('click', () => {
                window.location.href = 'index.html';
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    if (document.getElementById('startOverlay').classList.contains('hidden')) {
                        if (!isPlaying) startStory();
                    } else {
                        startStory();
                    }
                    e.preventDefault();
                }
                if (e.key === 'r' || e.key === 'R') resetStory();
                if (e.key === 'h' || e.key === 'H') window.location.href = 'index.html';
            });

            // ─── INIT ───
            resetStory();

            console.log('🌸 Day 08 · Story Animation · Ruth\'s 21st');
            console.log('💕 A gentle walk, flowers, and a ride into forever');
        })();
    </script>
