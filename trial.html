<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Day 08 · Ruth's 21st · Our Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Patrick+Hand&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0a12;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .story-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9 / 16;
            background: #1a1625;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ─── CANVAS ─── */
        #storyCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* ─── LYRIC OVERLAY ─── */
        .lyric-overlay {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 14px 20px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
        }

        .lyric-overlay.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .lyric-overlay .lyric-text {
            font-family: 'Patrick Hand', cursive;
            font-size: clamp(0.85rem, 3.2vw, 1.3rem);
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.02em;
            line-height: 1.5;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .lyric-overlay .lyric-text .highlight {
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .lyric-overlay .lyric-time {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 4px;
            display: block;
        }

        /* ─── CONTROLS ─── */
        .controls {
            position: absolute;
            bottom: 12px;
            right: 16px;
            z-index: 20;
            display: flex;
            gap: 8px;
            pointer-events: none;
        }

        .controls button {
            pointer-events: all;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 6px 14px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.6rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s ease;
            backdrop-filter: blur(8px);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
        }

        .controls button:active {
            transform: scale(0.92);
        }

        /* ─── PROGRESS BAR ─── */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            z-index: 15;
            pointer-events: none;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f8a4b8, #c78bdb, #f5c6a0);
            border-radius: 0 2px 2px 0;
            transition: width 0.1s linear;
        }

        /* ─── START OVERLAY ─── */
        .start-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(13, 10, 18, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px 30px;
            text-align: center;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.04);
        }

        .start-overlay .big-emoji {
            font-size: 4rem;
            margin-bottom: 6px;
            animation: float 2.8s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .start-overlay h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb, #f5c6a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .start-overlay .sub {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 6px;
        }

        .start-overlay .story-desc {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            max-width: 280px;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .start-overlay .btn-play {
            padding: 14px 52px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 40px rgba(199, 139, 219, 0.2);
            transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.02em;
            touch-action: manipulation;
        }

        .start-overlay .btn-play:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 50px rgba(199, 139, 219, 0.3);
        }

        .start-overlay .btn-play:active {
            transform: scale(0.94);
        }

        .start-overlay .btn-back {
            margin-top: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s ease;
            padding: 4px 16px;
            border-radius: 20px;
            text-decoration: none;
        }

        .start-overlay .btn-back:hover {
            color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 420px) {
            .story-container {
                border-radius: 0;
                max-width: 100%;
            }
            .start-overlay h1 {
                font-size: 2rem;
            }
            .start-overlay .big-emoji {
                font-size: 3.2rem;
            }
            .lyric-overlay {
                bottom: 20px;
                padding: 10px 14px 12px;
                width: 92%;
            }
            .lyric-overlay .lyric-text {
                font-size: 0.8rem;
            }
        }

        @media (max-height: 700px) {
            .start-overlay h1 {
                font-size: 1.8rem;
            }
            .start-overlay .big-emoji {
                font-size: 2.8rem;
            }
            .start-overlay .story-desc {
                font-size: 0.65rem;
                margin-bottom: 14px;
            }
            .start-overlay .btn-play {
                padding: 10px 40px;
                font-size: 0.85rem;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .story-container {
                max-width: 80vh;
                aspect-ratio: 9 / 16;
            }
        }
    </style>
</head>
<body>

    <div class="story-container" id="container">
        <!-- CANVAS -->
        <canvas id="storyCanvas"></canvas>

        <!-- LYRIC OVERLAY -->
        <div class="lyric-overlay" id="lyricOverlay">
            <div class="lyric-text" id="lyricText">🎵 <span class="highlight">You've got a friend in me</span></div>
            <span class="lyric-time" id="lyricTime">0:00</span>
        </div>

        <!-- PROGRESS -->
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <button id="restartBtn">↻ restart</button>
        </div>

        <!-- START OVERLAY -->
        <div class="start-overlay" id="startOverlay">
            <div class="big-emoji">💕</div>
            <h1>Our Story</h1>
            <div class="sub">— Ruth's 21st Celebration —</div>
            <div class="story-desc">
                From a walk in the field to forever together<br />
                ✨ A love story in 2 minutes ✨
            </div>
            <button class="btn-play" id="playBtn">▶ play story</button>
            <button class="btn-back" id="homeBtn">← back to celebration</button>
        </div>
    </div>

    <!-- ─── AUDIO ─── -->
    <audio id="player" preload="metadata"></audio>

    <script>
        (function() {
            'use strict';

            // ─── SETUP ───
            const canvas = document.getElementById('storyCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('container');

            let W, H;

            function resize() {
                const rect = container.getBoundingClientRect();
                canvas.width = rect.width * devicePixelRatio;
                canvas.height = rect.height * devicePixelRatio;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                W = canvas.width;
                H = canvas.height;
                ctx.scale(devicePixelRatio, devicePixelRatio);
                // store logical size
                W = rect.width;
                H = rect.height;
                // reset transform
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(devicePixelRatio, devicePixelRatio);
            }

            resize();
            window.addEventListener('resize', resize);

            // ─── AUDIO ───
            const audio = document.getElementById('player');
            audio.src = 'friend.mp3';
            audio.preload = 'metadata';
            audio.onerror = () => {
                console.warn('Audio not available — story plays with visual only');
            };

            // ─── STATE ───
            let isPlaying = false;
            let startTime = 0;
            let elapsed = 0;
            let animFrame = null;
            let currentScene = 0;
            let sceneProgress = 0;

            // ─── LYRICS WITH TIMESTAMPS (seconds) ───
            const LYRICS = [
                { time: 0.0, text: "🎵 You've got a friend in me" },
                { time: 4.5, text: "🎵 You've got a friend in me" },
                { time: 9.0, text: "When the road looks rough ahead" },
                { time: 13.5, text: "And you're miles and miles from your nice warm bed" },
                { time: 19.0, text: "You just remember what your old pal said" },
                { time: 24.0, text: "Boy, you've got a friend in me" },
                { time: 28.5, text: "Yeah, you've got a friend in me" },
                { time: 33.0, text: "If you've got troubles, I've got 'em too" },
                { time: 38.0, text: "There isn't anything I wouldn't do for you" },
                { time: 43.0, text: "We stick together and we see it through" },
                { time: 48.0, text: "'Cause you've got a friend in me" },
                { time: 52.5, text: "Yeah, you've got a friend in me" },
                { time: 57.0, text: "Some other folks might be a little bit smarter" },
                { time: 62.0, text: "Bigger and stronger too, maybe" },
                { time: 67.0, text: "But none of them will ever love you the way I do" },
                { time: 73.0, text: "It's me and you, boy, and as the years go by" },
                { time: 78.5, text: "Our friendship will never die" },
                { time: 83.5, text: "You're gonna see it's our destiny" },
                { time: 88.5, text: "You've got a friend in me" },
                { time: 93.5, text: "You've got a friend in me" },
                { time: 98.5, text: "You've got a friend in me" },
            ];

            // ─── SCENE DEFINITIONS (time ranges in seconds) ───
            const SCENES = [
                { start: 0, end: 18, label: 'field' },
                { start: 18, end: 36, label: 'car' },
                { start: 36, end: 56, label: 'date' },
                { start: 56, end: 76, label: 'propose' },
                { start: 76, end: 96, label: 'wedding' },
                { start: 96, end: 115, label: 'family' },
                { start: 115, end: 125, label: 'finale' },
            ];

            // ─── DRAWING HELPERS ───
            function drawPerson(x, y, scale, color, isFemale, armAngle, legAngle, emotion) {
                const s = scale || 1;
                const c = color || '#e8d5c4';
                const isF = isFemale || false;
                const arm = armAngle || 0;
                const leg = legAngle || 0;
                const em = emotion || 'neutral';

                ctx.save();
                ctx.translate(x, y);

                // shadow
                ctx.fillStyle = 'rgba(0,0,0,0.08)';
                ctx.beginPath();
                ctx.ellipse(0, 28 * s, 18 * s, 4 * s, 0, 0, Math.PI * 2);
                ctx.fill();

                // legs
                ctx.strokeStyle = c;
                ctx.lineWidth = 4 * s;
                ctx.lineCap = 'round';
                const legLen = 22 * s;
                ctx.beginPath();
                ctx.moveTo(-5 * s, 18 * s);
                ctx.lineTo(-5 * s + Math.sin(leg) * legLen, 18 * s + Math.cos(leg) * legLen);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(5 * s, 18 * s);
                ctx.lineTo(5 * s + Math.sin(-leg) * legLen, 18 * s + Math.cos(-leg) * legLen);
                ctx.stroke();

                // body
                ctx.fillStyle = isF ? '#f5a0b8' : '#6a7a8a';
                ctx.beginPath();
                ctx.roundRect(-10 * s, -20 * s, 20 * s, 40 * s, 6 * s);
                ctx.fill();

                // arms
                ctx.strokeStyle = c;
                ctx.lineWidth = 4 * s;
                const armLen = 18 * s;
                ctx.beginPath();
                ctx.moveTo(-10 * s, -12 * s);
                ctx.lineTo(-10 * s - Math.sin(arm) * armLen, -12 * s + Math.cos(arm) * armLen);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(10 * s, -12 * s);
                ctx.lineTo(10 * s + Math.sin(arm) * armLen, -12 * s + Math.cos(arm) * armLen);
                ctx.stroke();

                // head
                ctx.fillStyle = c;
                ctx.beginPath();
                ctx.arc(0, -28 * s, 14 * s, 0, Math.PI * 2);
                ctx.fill();

                // hair (female)
                if (isF) {
                    ctx.fillStyle = '#6a3a2a';
                    ctx.beginPath();
                    ctx.arc(0, -32 * s, 16 * s, Math.PI, 2 * Math.PI);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(-10 * s, -30 * s, 8 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(10 * s, -30 * s, 8 * s, 0, Math.PI * 2);
                    ctx.fill();
                    // bow
                    ctx.fillStyle = '#f5a0b8';
                    ctx.beginPath();
                    ctx.ellipse(12 * s, -38 * s, 5 * s, 3 * s, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(14 * s, -36 * s, 5 * s, 3 * s, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // male hair
                    ctx.fillStyle = '#4a3a2a';
                    ctx.beginPath();
                    ctx.arc(0, -32 * s, 15 * s, Math.PI, 2 * Math.PI);
                    ctx.fill();
                }

                // eyes
                ctx.fillStyle = '#2d1a0a';
                ctx.beginPath();
                ctx.arc(-5 * s, -30 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(5 * s, -30 * s, 2 * s, 0, Math.PI * 2);
                ctx.fill();

                // smile
                ctx.strokeStyle = '#2d1a0a';
                ctx.lineWidth = 1.5 * s;
                ctx.beginPath();
                if (em === 'happy') {
                    ctx.arc(0, -26 * s, 6 * s, 0.1, Math.PI - 0.1);
                } else if (em === 'love') {
                    ctx.arc(0, -27 * s, 5 * s, 0.1, Math.PI - 0.1);
                } else {
                    ctx.arc(0, -26 * s, 4 * s, 0.2, Math.PI - 0.2);
                }
                ctx.stroke();

                // blush (female)
                if (isF) {
                    ctx.fillStyle = 'rgba(245,160,184,0.2)';
                    ctx.beginPath();
                    ctx.arc(-9 * s, -26 * s, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(9 * s, -26 * s, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // roundRect polyfill for canvas
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                    if (r > w / 2) r = w / 2;
                    if (r > h / 2) r = h / 2;
                    this.moveTo(x + r, y);
                    this.lineTo(x + w - r, y);
                    this.quadraticCurveTo(x + w, y, x + w, y + r);
                    this.lineTo(x + w, y + h - r);
                    this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                    this.lineTo(x + r, y + h);
                    this.quadraticCurveTo(x, y + h, x, y + h - r);
                    this.lineTo(x, y + r);
                    this.quadraticCurveTo(x, y, x + r, y);
                    this.closePath();
                    return this;
                };
            }

            // ─── SCENE DRAWING FUNCTIONS ───

            function drawField(sceneProgress) {
                // sky gradient
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#87CEEB');
                grad.addColorStop(0.5, '#b8d4e8');
                grad.addColorStop(0.75, '#e8d5b0');
                grad.addColorStop(1, '#7a9a5a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // sun
                ctx.fillStyle = '#FFD700';
                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.arc(W * 0.8, H * 0.12, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // clouds
                drawCloud(W * 0.15, H * 0.08, 0.8);
                drawCloud(W * 0.55, H * 0.05, 1.0);
                drawCloud(W * 0.35, H * 0.18, 0.6);

                // hills
                ctx.fillStyle = '#6a8a4a';
                ctx.beginPath();
                ctx.ellipse(W * 0.1, H * 0.75, W * 0.4, H * 0.2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#5a7a3a';
                ctx.beginPath();
                ctx.ellipse(W * 0.7, H * 0.78, W * 0.5, H * 0.22, 0, 0, Math.PI * 2);
                ctx.fill();

                // flowers
                for (let i = 0; i < 30; i++) {
                    const fx = (i / 30) * W + Math.sin(i * 1.7) * 20;
                    const fy = H * 0.75 + Math.sin(i * 2.3) * 30 + 20;
                    drawFlower(fx, fy, 3 + Math.sin(i) * 2);
                }

                // path
                ctx.strokeStyle = 'rgba(160,140,100,0.3)';
                ctx.lineWidth = 8;
                ctx.setLineDash([8, 12]);
                ctx.beginPath();
                ctx.moveTo(W * 0.2, H);
                ctx.quadraticCurveTo(W * 0.25, H * 0.7, W * 0.35, H * 0.55);
                ctx.quadraticCurveTo(W * 0.45, H * 0.4, W * 0.6, H * 0.35);
                ctx.stroke();
                ctx.setLineDash([]);

                // couple walking
                const walkCycle = Math.sin(sceneProgress * 4) * 0.4;
                const px = W * 0.2 + sceneProgress * W * 0.45;
                const py = H * 0.52 + Math.sin(sceneProgress * 2) * 4;

                // girl (Ruth)
                drawPerson(px, py, 1.1, '#f0d5c0', true, walkCycle, walkCycle * 0.7, 'happy');
                // boy
                drawPerson(px + 30, py + 4, 1.15, '#e0c8b0', false, -walkCycle * 0.6, -walkCycle * 0.5, 'happy');

                // hearts floating
                for (let i = 0; i < 5; i++) {
                    const hx = px + 10 + Math.sin(sceneProgress * 3 + i * 2) * 40;
                    const hy = py - 40 + i * 10 + Math.sin(sceneProgress * 2 + i) * 15;
                    const hs = 0.6 + Math.sin(sceneProgress + i) * 0.2;
                    ctx.fillStyle = `rgba(245,160,184,${0.15 + Math.sin(sceneProgress * 2 + i) * 0.05})`;
                    ctx.font = `${16 * hs}px sans-serif`;
                    ctx.fillText('❤️', hx, hy);
                }

                // butterflies
                for (let i = 0; i < 3; i++) {
                    const bx = W * 0.1 + sceneProgress * W * 0.6 + i * 40 + Math.sin(sceneProgress * 3 + i * 2) * 30;
                    const by = H * 0.2 + i * 30 + Math.sin(sceneProgress * 2.5 + i * 1.5) * 20;
                    const bs = 0.5 + Math.sin(sceneProgress * 2 + i) * 0.2;
                    ctx.fillStyle = `rgba(199,139,219,${0.2 + Math.sin(sceneProgress + i) * 0.1})`;
                    ctx.font = `${18 * bs}px sans-serif`;
                    ctx.fillText('🦋', bx, by);
                }
            }

            function drawCloud(x, y, s) {
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(x, y, 20 * s, 0, Math.PI * 2);
                ctx.arc(x + 25 * s, y - 10 * s, 25 * s, 0, Math.PI * 2);
                ctx.arc(x + 50 * s, y, 20 * s, 0, Math.PI * 2);
                ctx.arc(x + 25 * s, y + 5 * s, 18 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawFlower(x, y, s) {
                const colors = ['#f5a0b8', '#c78bdb', '#f5c6a0', '#ff6b9d', '#d4b8e0'];
                const c = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillStyle = c;
                for (let i = 0; i < 5; i++) {
                    const a = (i / 5) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.arc(x + Math.cos(a) * 5 * s, y + Math.sin(a) * 5 * s, 4 * s, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(x, y, 2 * s, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawCar(sceneProgress) {
                // road
                ctx.fillStyle = '#4a5a4a';
                ctx.fillRect(0, H * 0.7, W, H * 0.3);
                ctx.fillStyle = '#3a4a3a';

                // landscape
                ctx.fillStyle = '#5a7a3a';
                ctx.fillRect(0, 0, W, H * 0.7);

                ctx.fillStyle = '#4a6a3a';

                ctx.lineTo(W * 0.15, H * 0.3);

                ctx.lineTo(W * 0.6, H * 0.45);

                ctx.lineTo(W * 0.9, H * 0.4);
                ctx.lineTo(W, H * 0.35);
                ctx.lineTo(W, H * 0.7);

                // road line
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.setLineDash([20, 30]);
                ctx.beginPath();
                ctx.moveTo(0, H * 0.82);
                ctx.lineTo(W, H * 0.82);
                ctx.stroke();

                // car
                const cx = W * 0.3 + sceneProgress * W * 0.4;

                ctx.save();

                // car body
                ctx.fillStyle = '#e85050';
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.roundRect(-40, -20, 80, 30, 6);

                // roof

                ctx.beginPath();
                ctx.roundRect(-25, -38, 50, 22, 8);

                // windows

                ctx.beginPath();
                ctx.roundRect(-20, -34, 18, 12, 4);
                ctx.fill();
                ctx.beginPath();
                ctx.roundRect(4, -34, 18, 12, 4);
                ctx.fill();

                // wheels
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(-25, 12, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(25, 12, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#444';
                ctx.beginPath();
                ctx.arc(-25, 12, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(25, 12, 5, 0, Math.PI * 2);

                // headlights
                ctx.fillStyle = '#FFD700';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#FFD700';
                ctx.beginPath();
                ctx.arc(42, -10, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(42, 2, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;

                // people in car (silhouettes)
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.arc(-10, -40, 8, 0, Math.PI * 2);

                ctx.beginPath();
                ctx.arc(12, -40, 8, 0, Math.PI * 2);

                // hearts trailing

                    const hx = -50 - i * 25 + Math.sin(sceneProgress * 3 + i) * 10;

                ctx.restore();

                // speed lines

                    ctx.strokeStyle = `rgba(255,255,255,${0.05 + Math.sin(i + sceneProgress) * 0.02})`;
                    ctx.lineWidth = 1;

                    ctx.moveTo(lx, H * 0.74 + i * 8);

                ctx.fill();
                ctx.fillStyle = '#FFD700';
                ctx.shadowBlur = 40;

            function drawPropose(sceneProgress) {

                // stars

                ctx.ellipse(W * 0.5, H * 0.85, W * 0.7, H * 0.15, 0, 0, Math.PI * 2);

                // couple

                const kneeY = py + 10 * (1 - kneelProgress);

            function drawFamily(sceneProgress) {

                // "The End" with sparkle

            // ─── SCENE DISPATCH ───
            function drawScene(sceneIndex, progress) {
                switch (sceneIndex) {
                    case 0:
                        drawField(progress);
                        break;
                    case 1:
                        drawCar(progress);
                        break;
                    case 2:
                        drawDate(progress);
                        break;
                    case 3:
                        drawPropose(progress);
                        break;
                    case 4:
                        drawWedding(progress);
                        break;
                    case 5:
                        drawFamily(progress);
                        break;
                    case 6:
                        drawFinale(progress);
                        break;
                    default:
                        break;
                }
            }

            // ─── MAIN LOOP ───
            function updateLyrics(elapsed) {
                const overlay = document.getElementById('lyricOverlay');
                const textEl = document.getElementById('lyricText');
                const timeEl = document.getElementById('lyricTime');

                let currentLyric = null;
                for (let i = LYRICS.length - 1; i >= 0; i--) {
                    if (elapsed >= LYRICS[i].time) {
                        currentLyric = LYRICS[i];
                        break;
                    }
                }

                if (currentLyric) {
                    textEl.innerHTML = currentLyric.text;
                    const mins = Math.floor(currentLyric.time / 60);
                    const secs = Math.floor(currentLyric.time % 60);
                    timeEl.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
                    overlay.classList.add('show');
                } else {
                    overlay.classList.remove('show');
                }
            }

            function render(timestamp) {
                if (!isPlaying) return;

                const now = performance.now();
                elapsed = (now - startTime) / 1000;
                const totalDuration = 125; // seconds

                // clamp
                if (elapsed > totalDuration) {
                    elapsed = totalDuration;
                }

                // progress
                document.getElementById('progressFill').style.width = (elapsed / totalDuration * 100) + '%';

                // find current scene
                let sceneIdx = 0;
                let sceneProg = 0;
                for (let i = 0; i < SCENES.length; i++) {
                    if (elapsed >= SCENES[i].start && elapsed < SCENES[i].end) {
                        sceneIdx = i;
                        sceneProg = (elapsed - SCENES[i].start) / (SCENES[i].end - SCENES[i].start);
                        break;
                    }
                    if (elapsed >= SCENES[i].end) {
                        sceneIdx = Math.min(i + 1, SCENES.length - 1);
                        sceneProg = 0;
                    }
                }
                // if at the very end
                if (elapsed >= SCENES[SCENES.length - 1].end) {
                    sceneIdx = SCENES.length - 1;
                    sceneProg = 1;
                }

                currentScene = sceneIdx;
                sceneProgress = sceneProg;

                // clear
                ctx.clearRect(0, 0, W, H);

                // draw scene
                drawScene(sceneIdx, sceneProg);

                // lyrics
                updateLyrics(elapsed);

                // if audio is playing, sync
                if (audio && !audio.paused) {
                    try {
                        const audioTime = audio.currentTime;
                        if (Math.abs(audioTime - elapsed) > 0.5) {
                            // drift correction
                        }
                    } catch (_) {}
                }

                if (elapsed >= totalDuration) {
                    // story complete
                    isPlaying = false;
                    if (audio) audio.pause();
                    document.getElementById('lyricOverlay').classList.add('show');
                    document.getElementById('lyricText').innerHTML = '💕 <span class="highlight">Forever & Always</span> 💕';
                    document.getElementById('lyricTime').textContent = '♥ 2:05';
                    return;
                }

                animFrame = requestAnimationFrame(render);
            }

            // ─── START / STOP ───
            function startStory() {
                if (isPlaying) return;
                isPlaying = true;
                startTime = performance.now();

                // play audio
                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                }

                document.getElementById('startOverlay').classList.add('hidden');

                if (animFrame) cancelAnimationFrame(animFrame);
                render(performance.now());
            }

            function stopStory() {
                isPlaying = false;
                if (audio) audio.pause();
                if (animFrame) cancelAnimationFrame(animFrame);
            }

            function resetStory() {
                stopStory();
                elapsed = 0;
                currentScene = 0;
                sceneProgress = 0;
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('lyricOverlay').classList.remove('show');
                document.getElementById('startOverlay').classList.remove('hidden');
                ctx.clearRect(0, 0, W, H);
                // draw initial scene
                drawScene(0, 0);
                document.getElementById('lyricText').innerHTML = '🎵 <span class="highlight">You\'ve got a friend in me</span>';
                document.getElementById('lyricTime').textContent = '0:00';
            }

            // ─── EVENTS ───
            document.getElementById('playBtn').addEventListener('click', startStory);
            document.getElementById('restartBtn').addEventListener('click', resetStory);
            document.getElementById('homeBtn').addEventListener('click', () => {
                window.location.href = 'index.html';
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    if (document.getElementById('startOverlay').classList.contains('hidden')) {
                        if (!isPlaying) startStory();
                    } else {
                        startStory();
                    }
                    e.preventDefault();
                }
                if (e.key === 'r' || e.key === 'R') resetStory();
                if (e.key === 'h' || e.key === 'H') window.location.href = 'index.html';
            });

            // ─── INIT ───
            resetStory();

            console.log('🌸 Day 08 · Story Animation · Ruth\'s 21st');
        })();
    </script>
