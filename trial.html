<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 8px;
            border: none;
            background: #0066ff;
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s ease;
            text-decoration: none;
        }

        .btn:hover {
            background: #0052cc;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-left: 8px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .timestamp {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            .icon {
                font-size: 3rem;
            }
            h1 {
                font-size: 1.2rem;
            }
            .btn {
                width: 100%;
                margin: 4px 0;
            }
            .btn-secondary {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="icon">💥</span>
        <h1>Site Crash</h1>
        <p>
            Oops! Something went wrong and the site crashed.<br />
            Please try refreshing the page or come back later.
        </p>

        <div>
            <button onclick="location.reload()" class="btn">🔄 Refresh Page</button>
            <a href="index.html" class="btn btn-secondary">🏠 Home</a>
        </div>

        <div class="timestamp">
            Error occurred: <span id="time"></span>
        </div>
    </div>

    <script>
        // Show current time
        document.getElementById('time').textContent = new Date().toLocaleString();

        // Log error
        console.error('Site crashed at:', new Date().toISOString());
    </script>

</body>
</html>
