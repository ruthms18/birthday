<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Day 08 · Ruth's 21st · Our Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Patrick+Hand&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0a12;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .story-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 9 / 16;
            background: #1a1625;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        #storyCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .lyric-overlay {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 14px 20px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
        }

        .lyric-overlay.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .lyric-overlay .lyric-text {
            font-family: 'Patrick Hand', cursive;
            font-size: clamp(0.85rem, 3.2vw, 1.3rem);
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.02em;
            line-height: 1.5;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .lyric-overlay .lyric-text .highlight {
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .lyric-overlay .lyric-time {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 4px;
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 12px;
            right: 16px;
            z-index: 20;
            display: flex;
            gap: 8px;
            pointer-events: none;
        }

        .controls button {
            pointer-events: all;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 6px 14px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.6rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s ease;
            backdrop-filter: blur(8px);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .controls button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
        }

        .controls button:active {
            transform: scale(0.92);
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            z-index: 15;
            pointer-events: none;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f8a4b8, #c78bdb, #f5c6a0);
            border-radius: 0 2px 2px 0;
            transition: width 0.1s linear;
        }

        .start-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(13, 10, 18, 0.85);
            backdrop-filter: blur(20px);
            padding: 40px 30px;
            text-align: center;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .start-overlay.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.04);
        }

        .start-overlay .big-emoji {
            font-size: 4rem;
            margin-bottom: 6px;
            animation: float 2.8s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .start-overlay h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb, #f5c6a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .start-overlay .sub {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 6px;
        }

        .start-overlay .story-desc {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            max-width: 280px;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 0.02em;
        }

        .start-overlay .btn-play {
            padding: 14px 52px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #f8a4b8, #c78bdb);
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 40px rgba(199, 139, 219, 0.2);
            transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            letter-spacing: 0.02em;
            touch-action: manipulation;
        }

        .start-overlay .btn-play:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 14px 50px rgba(199, 139, 219, 0.3);
        }

        .start-overlay .btn-play:active {
            transform: scale(0.94);
        }

        .start-overlay .btn-back {
            margin-top: 12px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.7rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s ease;
            padding: 4px 16px;
            border-radius: 20px;
            text-decoration: none;
        }

        .start-overlay .btn-back:hover {
            color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }

        @media (max-width: 420px) {
            .story-container {
                border-radius: 0;
                max-width: 100%;
            }
            .start-overlay h1 {
                font-size: 2rem;
            }
            .start-overlay .big-emoji {
                font-size: 3.2rem;
            }
            .lyric-overlay {
                bottom: 20px;
                padding: 10px 14px 12px;
                width: 92%;
            }
            .lyric-overlay .lyric-text {
                font-size: 0.8rem;
            }
        }

        @media (max-height: 700px) {
            .start-overlay h1 {
                font-size: 1.8rem;
            }
            .start-overlay .big-emoji {
                font-size: 2.8rem;
            }
            .start-overlay .story-desc {
                font-size: 0.65rem;
                margin-bottom: 14px;
            }
            .start-overlay .btn-play {
                padding: 10px 40px;
                font-size: 0.85rem;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .story-container {
                max-width: 80vh;
                aspect-ratio: 9 / 16;
            }
        }
    </style>
</head>
<body>

    <div class="story-container" id="container">
        <canvas id="storyCanvas"></canvas>

        <div class="lyric-overlay" id="lyricOverlay">
            <div class="lyric-text" id="lyricText">🎵 <span class="highlight">You've got a friend in me</span></div>
            <span class="lyric-time" id="lyricTime">0:00</span>
        </div>

        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

        <div class="controls">
            <button id="restartBtn">↻ restart</button>
        </div>

        <div class="start-overlay" id="startOverlay">
            <div class="big-emoji">💕</div>
            <h1>Our Story</h1>
            <div class="sub">— Ruth's 21st Celebration —</div>
            <div class="story-desc">
                A ride through love, with every mile a memory<br />
                ✨ A love story in 2 minutes ✨
            </div>
            <button class="btn-play" id="playBtn">▶ play story</button>
            <button class="btn-back" id="homeBtn">← back to celebration</button>
        </div>
    </div>

    <audio id="player" preload="metadata"></audio>

    <script>
        (function() {
            'use strict';

            const canvas = document.getElementById('storyCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('container');

            let W, H, dpr;

            function resize() {
                const rect = container.getBoundingClientRect();
                dpr = devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                canvas.style.width = rect.width + 'px';
                canvas.style.height = rect.height + 'px';
                W = rect.width;
                H = rect.height;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
            }
            resize();
            window.addEventListener('resize', resize);

            const audio = document.getElementById('player');
            audio.src = 'friend.mp3';
            audio.preload = 'metadata';
            audio.onerror = () => { console.warn('Audio not available — story plays with visual only'); };

            // ─── STATE ───
            let isPlaying = false;
            let startTime = 0;
            let elapsed = 0;
            let animFrame = null;
            let totalDuration = 22;

            // ─── LYRICS ───
            const LYRICS = [
                { time: 0.0, text: "🎵 You've got a friend in me" },
                { time: 4.5, text: "🎵 You've got a friend in me" },
                { time: 9.0, text: "When the road looks rough ahead" },
                { time: 13.5, text: "And you're miles and miles from your nice warm bed" },
                { time: 19.0, text: "You just remember what your old pal said" },
                { time: 24.0, text: "Boy, you've got a friend in me" },
                { time: 28.5, text: "Yeah, you've got a friend in me" },
                { time: 33.0, text: "If you've got troubles, I've got 'em too" },
                { time: 38.0, text: "There isn't anything I wouldn't do for you" },
                { time: 43.0, text: "We stick together and we see it through" },
                { time: 48.0, text: "'Cause you've got a friend in me" },
                { time: 52.5, text: "Yeah, you've got a friend in me" },
            ];

            // ─── BILLBOARD SENTENCES ───
            const BILLBOARD_MSGS = [
                "✨ Every mile with you is a memory in the making ✨",
                "💕 Love is not about how many days we've spent, but how much we've shared 💕",
                "🌹 You are the reason my heart beats a little faster every day 🌹",
                "🌟 Together we are unstoppable, together we are infinite 🌟",
                "💫 Your smile is the sunshine that lights up my darkest days 💫",
                "🌸 In a world full of chaos, you are my peace and my home 🌸",
                "💖 You've got a friend in me, and I've got you in my heart forever 💖",
                "🌅 The best part of my day is the moment I get to see you smile 🌅",
                "💞 Ruth, you are my forever, my always, my everything 💞",
                "🎵 Our song plays on, and our love grows stronger with every note 🎵"
            ];

            // ─── DRAWING HELPERS ───

            function roundRect(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }

            // ─── DRAW ROAD (3 lanes, perspective) ───
            function drawRoad(time, scrollOffset) {
                // Sky gradient – romantic sunset
                const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
                skyGrad.addColorStop(0, '#1a0a2a');
                skyGrad.addColorStop(0.3, '#2a1a3a');
                skyGrad.addColorStop(0.6, '#4a2a3a');
                skyGrad.addColorStop(0.8, '#8a4a3a');
                skyGrad.addColorStop(1, '#c87a4a');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, W, H * 0.6);

                // Sun
                const sunX = W * 0.75 + Math.sin(time * 0.1) * 15;
                const sunY = H * 0.22 + Math.sin(time * 0.05) * 5;
                const sunR = 30 + Math.sin(time * 0.3) * 2;
                const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR * 3);
                sunGrad.addColorStop(0, 'rgba(255, 220, 160, 0.7)');
                sunGrad.addColorStop(0.2, 'rgba(255, 180, 100, 0.4)');
                sunGrad.addColorStop(0.6, 'rgba(200, 100, 50, 0.15)');
                sunGrad.addColorStop(1, 'rgba(200, 80, 40, 0)');
                ctx.fillStyle = sunGrad;
                ctx.beginPath();
                ctx.arc(sunX, sunY, sunR * 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255, 230, 180, 0.8)';
                ctx.beginPath();
                ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2);
                ctx.fill();

                // Clouds
                for (let i = 0; i < 5; i++) {
                    const cx = (i * 140 + time * 6) % (W + 100) - 50;
                    const cy = 10 + i * 20 + Math.sin(time * 0.2 + i * 1.2) * 10;
                    const cs = 0.5 + Math.sin(time * 0.15 + i * 0.7) * 0.15;
                    ctx.fillStyle = `rgba(255,255,255,${0.04 + Math.sin(time * 0.1 + i) * 0.015})`;
                    ctx.beginPath();
                    ctx.arc(cx, cy, 20 * cs, 0, Math.PI * 2);
                    ctx.arc(cx + 24 * cs, cy - 8 * cs, 24 * cs, 0, Math.PI * 2);
                    ctx.arc(cx + 48 * cs, cy, 20 * cs, 0, Math.PI * 2);
                    ctx.arc(cx + 24 * cs, cy + 6 * cs, 18 * cs, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Distant hills
                ctx.fillStyle = 'rgba(30, 50, 30, 0.3)';
                ctx.beginPath();
                ctx.moveTo(0, H * 0.6);
                for (let x = 0; x <= W; x += 2) {
                    const y = H * 0.6 + Math.sin(x * 0.008 + time * 0.02) * 8 + Math.sin(x * 0.02 + time * 0.015) * 4;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(W, H);
                ctx.lineTo(0, H);
                ctx.fill();

                ctx.fillStyle = 'rgba(40, 60, 40, 0.25)';
                ctx.beginPath();
                ctx.moveTo(0, H * 0.63);
                for (let x = 0; x <= W; x += 2) {
                    const y = H * 0.63 + Math.sin(x * 0.01 + time * 0.025 + 1.2) * 7 + Math.sin(x * 0.025 + time * 0.02) * 3;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(W, H);
                ctx.lineTo(0, H);
                ctx.fill();

                // ─── 3-LANE ROAD (perspective) ───
                const vpX = W * 0.5;
                const vpY = H * 0.32;
                const roadW = W * 0.85;
                const laneCount = 3;

                // Road surface
                ctx.fillStyle = '#1a1a1e';
                ctx.beginPath();
                ctx.moveTo(vpX - 10, vpY);
                ctx.lineTo(vpX + 10, vpY);
                ctx.lineTo(vpX + roadW * 0.5, H);
                ctx.lineTo(vpX - roadW * 0.5, H);
                ctx.fill();

                // Road edge glow
                ctx.strokeStyle = 'rgba(255,255,255,0.02)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(vpX - 10, vpY);
                ctx.lineTo(vpX - roadW * 0.5, H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(vpX + 10, vpY);
                ctx.lineTo(vpX + roadW * 0.5, H);
                ctx.stroke();

                // Lane dividers (3 lanes → 2 lines)
                for (let lane = 1; lane < laneCount; lane++) {
                    const t = lane / laneCount;
                    const leftX = vpX - 10 + (vpX - roadW * 0.5 - vpX + 10) * t;
                    const rightX = vpX + 10 + (vpX + roadW * 0.5 - vpX - 10) * t;
                    const centerX = (leftX + rightX) / 2;

                    // Dashed lines with animation (scroll)
                    const dashLen = 20;
                    const gapLen = 25;
                    const totalDash = dashLen + gapLen;
                    const offset = (scrollOffset * 80) % totalDash;

                    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([dashLen, gapLen]);
                    ctx.lineDashOffset = -offset;
                    ctx.beginPath();
                    ctx.moveTo(centerX, vpY + 12);
                    ctx.lineTo(centerX, H);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Road edge lines (solid)
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(vpX - 10, vpY);
                ctx.lineTo(vpX - roadW * 0.5 + 6, H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(vpX + 10, vpY);
                ctx.lineTo(vpX + roadW * 0.5 - 6, H);
                ctx.stroke();

                // ─── TRAFFIC CARS IN LEFT & RIGHT LANES ───
                // Each car: lane (0=left, 2=right), vertical position, speed, color
                const cars = [
                    { lane: 0, yPos: 0.1, speed: 0.6, color: '#c0392b', size: 0.7 },
                    { lane: 0, yPos: 0.6, speed: 0.4, color: '#2980b9', size: 0.65 },
                    { lane: 0, yPos: 0.85, speed: 0.7, color: '#27ae60', size: 0.6 },
                    { lane: 2, yPos: 0.25, speed: -0.5, color: '#8e44ad', size: 0.7 },
                    { lane: 2, yPos: 0.5, speed: -0.35, color: '#d35400', size: 0.65 },
                    { lane: 2, yPos: 0.75, speed: -0.6, color: '#2c3e50', size: 0.6 },
                    { lane: 0, yPos: 0.35, speed: 0.55, color: '#e74c3c', size: 0.55 },
                    { lane: 2, yPos: 0.95, speed: -0.45, color: '#16a085', size: 0.5 },
                    { lane: 0, yPos: 0.0, speed: 0.8, color: '#f39c12', size: 0.5 },
                    { lane: 2, yPos: 0.05, speed: -0.7, color: '#1abc9c', size: 0.5 },
                ];

                const speedFactor = 0.8 + Math.sin(time * 0.1) * 0.1;

                for (const car of cars) {
                    // Compute lane horizontal position with perspective
                    const laneT = (car.lane + 0.5) / laneCount; // 0.166, 0.5, 0.833
                    const leftX = vpX - 10 + (vpX - roadW * 0.5 - vpX + 10) * laneT;
                    const rightX = vpX + 10 + (vpX + roadW * 0.5 - vpX - 10) * laneT;
                    const centerX = (leftX + rightX) / 2;
                    const laneWidth = rightX - leftX;

                    // Vertical position with wrap-around
                    let rawY = (car.yPos + time * car.speed * speedFactor * 0.04) % 1;
                    if (rawY < 0) rawY += 1;
                    const yPos = vpY + (H - vpY) * rawY;

                    // Only draw if within visible road
                    if (yPos > vpY + 8 && yPos < H - 2) {
                        const scale = 0.12 + 0.88 * (1 - (yPos - vpY) / (H - vpY));
                        const carW = laneWidth * 0.45 * scale * 0.75;
                        const carH = carW * 0.4;

                        ctx.save();
                        ctx.translate(centerX, yPos);
                        ctx.scale(scale, scale);

                        // Shadow
                        ctx.fillStyle = 'rgba(0,0,0,0.12)';
                        ctx.beginPath();
                        ctx.ellipse(0, carH * 1.2, carW * 0.6, carH * 0.12, 0, 0, Math.PI * 2);
                        ctx.fill();

                        // Car body
                        const bw = carW * 1.9;
                        const bh = carH * 1.2;
                        ctx.shadowColor = 'rgba(0,0,0,0.15)';
                        ctx.shadowBlur = 6;
                        ctx.fillStyle = car.color;
                        ctx.beginPath();
                        roundRect(-bw / 2, -bh / 2, bw, bh, 4);
                        ctx.fill();

                        // Roof / window (dark tint)
                        ctx.fillStyle = 'rgba(30,40,50,0.3)';
                        ctx.shadowBlur = 0;
                        ctx.beginPath();
                        roundRect(-bw * 0.28, -bh * 0.65, bw * 0.56, bh * 0.35, 3);
                        ctx.fill();

                        // Headlights / taillights
                        const isGoingDown = car.speed > 0;
                        const lightX = isGoingDown ? bw * 0.42 : -bw * 0.42;
                        ctx.fillStyle = isGoingDown ? 'rgba(255,200,100,0.25)' : 'rgba(255,30,30,0.25)';
                        ctx.beginPath();
                        ctx.arc(lightX, -bh * 0.15, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(lightX, bh * 0.15, 3, 0, Math.PI * 2);
                        ctx.fill();

                        // Wheels
                        ctx.fillStyle = '#1a1a1a';
                        ctx.shadowBlur = 3;
                        ctx.beginPath();
                        ctx.arc(-bw * 0.32, bh * 0.55, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(bw * 0.32, bh * 0.55, 4, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.restore();
                    }
                }

                // Return the road's vanishing point info for car placement
                return { vpX, vpY, roadW };
            }

            // ─── DRAW CONVERTIBLE (from behind, in middle lane) ───
            function drawConvertible(time, roadInfo, scrollOffset, ladySkinTone) {
                const { vpX, vpY, roadW } = roadInfo;

                // Middle lane position
                const laneT = 0.5;
                const leftX = vpX - 10 + (vpX - roadW * 0.5 - vpX + 10) * laneT;
                const rightX = vpX + 10 + (vpX + roadW * 0.5 - vpX - 10) * laneT;
                const centerX = (leftX + rightX) / 2;
                const laneWidth = rightX - leftX;

                // Car vertical position (fixed in middle of screen)
                const yPos = H * 0.62 + Math.sin(time * 0.3) * 2;

                // Size based on perspective
                const scale = 0.55 + 0.45 * (1 - (yPos - vpY) / (H - vpY));
                const carW = laneWidth * 0.5 * scale * 0.7;
                const carH = carW * 0.42;

                ctx.save();
                ctx.translate(centerX, yPos);

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.15)';
                ctx.beginPath();
                ctx.ellipse(0, carH * 0.55, carW * 0.7, carH * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();

                // ─── CAR BODY ───
                // Rear bumper
                ctx.fillStyle = '#1a1a1e';
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                roundRect(-carW * 0.48, -carH * 0.2, carW * 0.96, carH * 0.6, 6);
                ctx.fill();

                // Main body (deep red convertible)
                const bodyColor = '#b31b1b';
                ctx.fillStyle = bodyColor;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                roundRect(-carW * 0.44, -carH * 0.4, carW * 0.88, carH * 0.8, 5);
                ctx.fill();

                // Rear deck
                ctx.fillStyle = '#8a1515';
                ctx.beginPath();
                roundRect(-carW * 0.4, -carH * 0.38, carW * 0.8, carH * 0.28, 4);
                ctx.fill();

                // Trunk line
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-carW * 0.35, -carH * 0.12);
                ctx.lineTo(carW * 0.35, -carH * 0.12);
                ctx.stroke();

                // ─── TAILLIGHTS ───
                const tlColor = 'rgba(255,30,30,0.6)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255,0,0,0.2)';
                ctx.fillStyle = tlColor;
                ctx.beginPath();
                roundRect(-carW * 0.4, -carH * 0.22, carW * 0.08, carH * 0.12, 3);
                ctx.fill();
                ctx.beginPath();
                roundRect(carW * 0.32, -carH * 0.22, carW * 0.08, carH * 0.12, 3);
                ctx.fill();

                // Brake lights (glowing)
                ctx.fillStyle = 'rgba(255,50,50,0.5)';
                ctx.shadowBlur = 18;
                ctx.shadowColor = 'rgba(255,0,0,0.2)';
                ctx.beginPath();
                roundRect(-carW * 0.38, -carW * 0.04, carW * 0.06, carW * 0.06, 2);
                ctx.fill();
                ctx.beginPath();
                roundRect(carW * 0.32, -carW * 0.04, carW * 0.06, carW * 0.06, 2);
                ctx.fill();

                ctx.shadowBlur = 0;

                // ─── SEATS ───
                const seatW = carW * 0.28;
                const seatH = carH * 0.5;
                const seatY = -carH * 0.3;

                // Driver seat (left side)
                ctx.fillStyle = '#2a2a2e';
                ctx.beginPath();
                roundRect(-carW * 0.3, seatY, seatW, seatH, 4);
                ctx.fill();

                // Passenger seat (right side)
                ctx.fillStyle = '#2a2a2e';
                ctx.beginPath();
                roundRect(carW * 0.02, seatY, seatW, seatH, 4);
                ctx.fill();

                // Headrests
                ctx.fillStyle = '#1a1a1e';
                ctx.beginPath();
                roundRect(-carW * 0.26, seatY - seatH * 0.35, seatW * 0.35, seatH * 0.2, 3);
                ctx.fill();
                ctx.beginPath();
                roundRect(carW * 0.06, seatY - seatH * 0.35, seatW * 0.35, seatH * 0.2, 3);
                ctx.fill();

                // ─── CHARACTERS ───

                // GUY (driver, left) – dark brown skin
                const guyX = -carW * 0.18;
                const guyY = seatY - seatH * 0.1;

                ctx.save();
                ctx.translate(guyX, guyY);

                // Body
                const bW = seatW * 0.75;
                const bH = seatH * 0.7;
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath();
                roundRect(-bW / 2, -bH * 0.1, bW, bH, 8);
                ctx.fill();
                ctx.fillStyle = '#1a1a2a';
                ctx.beginPath();
                roundRect(-bW * 0.4, -bH * 0.05, bW * 0.8, bH * 0.7, 4);
                ctx.fill();

                // Head – dark brown
                const headR = seatW * 0.3;
                ctx.fillStyle = '#5a3a2a';
                ctx.beginPath();
                ctx.arc(0, -bH * 0.35, headR, 0, Math.PI * 2);
                ctx.fill();

                // Hair
                ctx.fillStyle = '#2a1a0a';
                ctx.beginPath();
                ctx.arc(0, -bH * 0.45, headR * 0.9, Math.PI, 2 * Math.PI);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-headR * 0.5, -bH * 0.4, headR * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(headR * 0.5, -bH * 0.4, headR * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // Arm (left on steering wheel, right around lady)
                ctx.strokeStyle = '#5a3a2a';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';

                // Left arm
                ctx.beginPath();
                ctx.moveTo(-bW * 0.4, -bH * 0.1);
                ctx.lineTo(-bW * 0.6, -bH * 0.25);
                ctx.stroke();

                // Right arm – around lady
                const armExtend = 0.5 + Math.sin(time * 0.2) * 0.05;
                ctx.beginPath();
                ctx.moveTo(bW * 0.4, -bH * 0.1);
                ctx.lineTo(bW * 0.4 + carW * 0.18 * armExtend, -bH * 0.2 - carH * 0.08);
                ctx.stroke();

                // Hand on her shoulder
                ctx.fillStyle = '#5a3a2a';
                ctx.beginPath();
                ctx.arc(bW * 0.4 + carW * 0.18 * armExtend, -bH * 0.2 - carH * 0.08, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // ─── LADY (passenger, right) – darker skin (tan/medium) ───
                const ladyX = carW * 0.18;
                const ladyY = seatY - seatH * 0.1;

                ctx.save();
                ctx.translate(ladyX, ladyY);

                // Lean in toward guy (gentle sway)
                const leanX = -4 + Math.sin(time * 0.3) * 1.5;
                const leanRot = -0.02 + Math.sin(time * 0.25) * 0.01;
                ctx.translate(leanX, 0);
                ctx.rotate(leanRot);

                // Body – medium/tan skin
                const lBW = seatW * 0.7;
                const lBH = seatH * 0.65;
                ctx.fillStyle = '#d4a88a';
                ctx.beginPath();
                roundRect(-lBW / 2, -lBH * 0.1, lBW, lBH, 8);
                ctx.fill();

                // Dress (soft pink)
                ctx.fillStyle = '#e8a0b8';
                ctx.beginPath();
                roundRect(-lBW * 0.45, -lBH * 0.05, lBW * 0.9, lBH * 0.75, 4);
                ctx.fill();

                // Head – tan/medium skin
                const lHeadR = seatW * 0.28;
                ctx.fillStyle = '#d4a88a';
                ctx.beginPath();
                ctx.arc(0, -lBH * 0.35, lHeadR, 0, Math.PI * 2);
                ctx.fill();

                // Hair (flowing, light brown)
                ctx.fillStyle = '#b8885a';
                ctx.beginPath();
                ctx.arc(0, -lBH * 0.45, lHeadR * 1.0, Math.PI, 2 * Math.PI);
                ctx.fill();
                for (let i = -3; i <= 3; i++) {
                    const angle = Math.PI / 2 + i * 0.12;
                    const hx = Math.sin(angle) * lHeadR * 0.8;
                    const hy = -lBH * 0.35 + Math.cos(angle) * lHeadR * 0.8;
                    ctx.beginPath();
                    ctx.moveTo(hx, hy);
                    const len = 18 + Math.sin(i * 0.7 + time * 0.5) * 4;
                    ctx.quadraticCurveTo(hx + i * 3, hy + len * 0.6, hx + i * 1.5, hy + len);
                    ctx.strokeStyle = '#b8885a';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }

                // Hair bow
                ctx.fillStyle = '#f5a0b8';
                ctx.beginPath();
                ctx.ellipse(lHeadR * 0.7, -lBH * 0.5, 5, 3.5, 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(lHeadR * 0.8, -lBH * 0.48, 5, 3.5, -0.4, 0, Math.PI * 2);
                ctx.fill();

                // Blush
                ctx.fillStyle = 'rgba(200,120,130,0.15)';
                ctx.beginPath();
                ctx.arc(-lHeadR * 0.5, -lBH * 0.3, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(lHeadR * 0.5, -lBH * 0.3, 4, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#8a5a4a';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, -lBH * 0.24, 4, 0.1, Math.PI - 0.1);
                ctx.stroke();

                ctx.restore();

                // ─── STEERING WHEEL ───
                ctx.save();
                ctx.translate(-carW * 0.25, seatY + seatH * 0.05);
                ctx.fillStyle = 'rgba(30,30,35,0.25)';
                ctx.beginPath();
                ctx.ellipse(0, 0, carW * 0.08, carW * 0.04, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(40,40,45,0.15)';
                ctx.beginPath();
                ctx.ellipse(0, 0, carW * 0.06, carW * 0.03, 0.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // ─── WINDSHIELD (subtle) ───
                ctx.strokeStyle = 'rgba(150,200,255,0.02)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-carW * 0.32, -carH * 0.45);
                ctx.quadraticCurveTo(0, -carH * 0.55, carW * 0.32, -carH * 0.45);
                ctx.stroke();

                // ─── REAR VIEW MIRROR ───
                ctx.fillStyle = 'rgba(40,40,45,0.08)';
                ctx.beginPath();
                ctx.ellipse(0, -carH * 0.45, carW * 0.04, carW * 0.025, 0, 0, Math.PI * 2);
                ctx.fill();

                // ─── LICENSE PLATE ───
                ctx.fillStyle = 'rgba(255,255,255,0.02)';
                ctx.fillRect(-carW * 0.06, carH * 0.3, carW * 0.12, carH * 0.06);
                ctx.fillStyle = 'rgba(255,255,255,0.015)';
                ctx.font = `${carH * 0.035}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('RUTH 21', 0, carH * 0.33);

                ctx.restore();
            }

            // ─── BILLBOARD ───
            function drawBillboard(time) {
                const msgIndex = Math.floor((time * 0.15) % BILLBOARD_MSGS.length);
                const msg = BILLBOARD_MSGS[msgIndex];
                const nextMsg = BILLBOARD_MSGS[(msgIndex + 1) % BILLBOARD_MSGS.length];
                const blend = (time * 0.15) % 1;

                const bx = W * 0.06;
                const by = H * 0.03;
                const bw = W * 0.88;
                const bh = H * 0.13;

                ctx.save();

                // Billboard shadow
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 25;
                ctx.fillStyle = 'rgba(15,12,20,0.5)';
                ctx.beginPath();
                roundRect(bx, by, bw, bh, 8);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Frame
                ctx.strokeStyle = 'rgba(255,200,150,0.03)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                roundRect(bx, by, bw, bh, 8);
                ctx.stroke();

                // Inner gradient
                const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
                grad.addColorStop(0, 'rgba(30,15,40,0.5)');
                grad.addColorStop(0.3, 'rgba(50,25,60,0.4)');
                grad.addColorStop(0.7, 'rgba(50,25,60,0.4)');
                grad.addColorStop(1, 'rgba(30,15,40,0.5)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                roundRect(bx + 4, by + 4, bw - 8, bh - 8, 6);
                ctx.fill();

                // Decorative line
                ctx.strokeStyle = `rgba(255,200,150,${0.04 + Math.sin(time * 0.3) * 0.015})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(bx + 20, by + bh - 10);
                ctx.lineTo(bx + bw - 20, by + bh - 10);
                ctx.stroke();

                // Message text with crossfade
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const fontSize = Math.min(bh * 0.3, 18);
                ctx.font = `bold ${fontSize}px "Playfair Display", serif`;

                // Current message
                ctx.fillStyle = `rgba(255,220,200,${(1 - blend) * 0.75})`;
                ctx.fillText(msg, W * 0.5, by + bh * 0.48);

                // Next message (fading in)
                ctx.fillStyle = `rgba(255,220,200,${blend * 0.75})`;
                ctx.fillText(nextMsg, W * 0.5, by + bh * 0.48);

                // Small hearts on corners
                ctx.font = '12px sans-serif';
                ctx.fillStyle = `rgba(245,160,184,${0.05 + Math.sin(time * 0.5) * 0.02})`;
                ctx.fillText('💕', bx + 16, by + 16);
                ctx.fillText('💕', bx + bw - 16, by + 16);
                ctx.fillText('💕', bx + 16, by + bh - 16);
                ctx.fillText('💕', bx + bw - 16, by + bh - 16);

                ctx.restore();
            }

            // ─── MAIN RENDER ───
            function render(timestamp) {
                if (!isPlaying) return;

                const now = performance.now();
                elapsed = (now - startTime) / 1000;

                if (elapsed > totalDuration) {
                    elapsed = totalDuration;
                }

                document.getElementById('progressFill').style.width = (elapsed / totalDuration * 100) + '%';

                // Clear
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#0d0a12';
                ctx.fillRect(0, 0, W, H);

                // Scroll offset for road animation
                const scrollOffset = elapsed * 0.6;

                // Draw road
                const roadInfo = drawRoad(elapsed, scrollOffset);

                // Draw billboard (on top)
                drawBillboard(elapsed);

                // Draw convertible (with lady skin tone adjusted)
                drawConvertible(elapsed, roadInfo, scrollOffset);

                // ─── LYRICS ───
                updateLyrics(elapsed);

                if (audio && !audio.paused) {
                    try {
                        const audioTime = audio.currentTime;
                        // drift correction if needed
                    } catch (_) {}
                }

                if (elapsed >= totalDuration) {
                    isPlaying = false;
                    if (audio) audio.pause();
                    document.getElementById('lyricOverlay').classList.add('show');
                    document.getElementById('lyricText').innerHTML = '💕 <span class="highlight">Forever & Always</span> 💕';
                    document.getElementById('lyricTime').textContent = '♥ 2:05';
                    return;
                }

                animFrame = requestAnimationFrame(render);
            }

            // ─── UPDATE LYRICS ───
            function updateLyrics(elapsed) {
                const overlay = document.getElementById('lyricOverlay');
                const textEl = document.getElementById('lyricText');
                const timeEl = document.getElementById('lyricTime');

                let currentLyric = null;
                for (let i = LYRICS.length - 1; i >= 0; i--) {
                    if (elapsed >= LYRICS[i].time) {
                        currentLyric = LYRICS[i];
                        break;
                    }
                }

                if (currentLyric && elapsed < 22) {
                    textEl.innerHTML = currentLyric.text;
                    const mins = Math.floor(currentLyric.time / 60);
                    const secs = Math.floor(currentLyric.time % 60);
                    timeEl.textContent = `${mins}:${secs.toString().padStart(2,'0')}`;
                    overlay.classList.add('show');
                } else if (elapsed >= 22) {
                    textEl.innerHTML = '💕 <span class="highlight">Forever & Always</span> 💕';
                    timeEl.textContent = '♥ 2:05';
                    overlay.classList.add('show');
                } else {
                    overlay.classList.remove('show');
                }
            }

            // ─── START / STOP ───
            function startStory() {
                if (isPlaying) return;
                isPlaying = true;
                startTime = performance.now();

                if (audio) {
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                }

                document.getElementById('startOverlay').classList.add('hidden');

                if (animFrame) cancelAnimationFrame(animFrame);
                render(performance.now());
            }

            function stopStory() {
                isPlaying = false;
                if (audio) audio.pause();
                if (animFrame) cancelAnimationFrame(animFrame);
            }

            function resetStory() {
                stopStory();
                elapsed = 0;
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('lyricOverlay').classList.remove('show');
                document.getElementById('startOverlay').classList.remove('hidden');
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#0d0a12';
                ctx.fillRect(0, 0, W, H);
                document.getElementById('lyricText').innerHTML = '🎵 <span class="highlight">You\'ve got a friend in me</span>';
                document.getElementById('lyricTime').textContent = '0:00';
            }

            // ─── EVENTS ───
            document.getElementById('playBtn').addEventListener('click', startStory);
            document.getElementById('restartBtn').addEventListener('click', resetStory);
            document.getElementById('homeBtn').addEventListener('click', () => {
                window.location.href = 'index.html';
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    if (document.getElementById('startOverlay').classList.contains('hidden')) {
                        if (!isPlaying) startStory();
                    } else {
                        startStory();
                    }
                    e.preventDefault();
                }
                if (e.key === 'r' || e.key === 'R') resetStory();
                if (e.key === 'h' || e.key === 'H') window.location.href = 'index.html';
            });

            // ─── INIT ───
            resetStory();

            console.log('🌸 Day 08 · Driving Story · Ruth\'s 21st');
            console.log('💕 3-lane road with traffic, billboard, and romantic vibe');
        })();
    </script>
